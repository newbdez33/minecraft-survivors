    <rect x="28" y="16" width="12" height="18" fill="#4A7F2B"/>
    <rect x="28" y="10" width="12" height="6" fill="#5D9B37"/>
    <rect x="46" y="22" width="6" height="18" fill="#3D6B23"/>
    <rect x="40" y="16" width="12" height="18" fill="#4A7F2B"/>
    <rect x="40" y="10" width="12" height="6" fill="#5D9B37"/>
