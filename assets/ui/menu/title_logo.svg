<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" width="500" height="100" shape-rendering="crispEdges">
  <!-- Minecraft Survivors Title Logo - Pixel Art Style -->
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcc00"/>
      <stop offset="50%" style="stop-color:#ff9900"/>
      <stop offset="100%" style="stop-color:#cc6600"/>
    </linearGradient>
  </defs>

  <!-- Background glow -->
  <ellipse cx="250" cy="50" rx="240" ry="45" fill="#ff6600" opacity="0.15"/>

  <!-- Main Title Text - MINECRAFT SURVIVORS -->
  <text x="250" y="45" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="36" font-weight="bold" fill="url(#titleGrad)" stroke="#2a1a00" stroke-width="3">MINECRAFT</text>
  <text x="250" y="85" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="32" font-weight="bold" fill="url(#titleGrad)" stroke="#2a1a00" stroke-width="2">SURVIVORS</text>

  <!-- Highlight effect -->
  <text x="250" y="45" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="36" font-weight="bold" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3">MINECRAFT</text>
  <text x="250" y="85" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="32" font-weight="bold" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3">SURVIVORS</text>
</svg>
