<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" width="200" height="40" shape-rendering="crispEdges">
  <!-- Minecraft stone button - pressed state (inverted bevel) -->
  <!-- Outer dark border -->
  <rect x="0" y="0" width="200" height="40" fill="#1a1a1a"/>
  <!-- Dark top/left edge (inverted 3D bevel) -->
  <rect x="2" y="2" width="196" height="2" fill="#505050"/>
  <rect x="2" y="2" width="2" height="36" fill="#505050"/>
  <!-- Light bottom/right edge -->
  <rect x="2" y="36" width="196" height="2" fill="#a0a0a0"/>
  <rect x="196" y="2" width="2" height="36" fill="#a0a0a0"/>
  <!-- Main button body - darker stone -->
  <rect x="4" y="4" width="192" height="32" fill="#707070"/>
  <!-- Texture pattern -->
  <rect x="10" y="8" width="4" height="4" fill="#606060"/>
  <rect x="30" y="15" width="3" height="3" fill="#808080"/>
  <rect x="60" y="10" width="4" height="4" fill="#606060"/>
  <rect x="90" y="20" width="3" height="3" fill="#808080"/>
  <rect x="120" y="8" width="4" height="4" fill="#606060"/>
  <rect x="150" y="18" width="3" height="3" fill="#808080"/>
  <rect x="180" y="12" width="4" height="4" fill="#606060"/>
</svg>
