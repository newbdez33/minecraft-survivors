<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" width="360" height="400" shape-rendering="crispEdges">
  <!-- Minecraft-style dark panel with stone border -->
  <!-- Outer black border -->
  <rect x="0" y="0" width="360" height="400" fill="#0a0a0a"/>

  <!-- Stone border - outer light edge (top/left) -->
  <rect x="4" y="4" width="352" height="6" fill="#6a6a6a"/>
  <rect x="4" y="4" width="6" height="392" fill="#6a6a6a"/>

  <!-- Stone border - outer dark edge (bottom/right) -->
  <rect x="4" y="390" width="352" height="6" fill="#3a3a3a"/>
  <rect x="350" y="4" width="6" height="392" fill="#3a3a3a"/>

  <!-- Stone border - inner light edge -->
  <rect x="10" y="10" width="340" height="4" fill="#808080"/>
  <rect x="10" y="10" width="4" height="380" fill="#808080"/>

  <!-- Stone border - inner dark edge -->
  <rect x="10" y="386" width="340" height="4" fill="#2a2a2a"/>
  <rect x="346" y="10" width="4" height="380" fill="#2a2a2a"/>

  <!-- Inner dark background -->
  <rect x="14" y="14" width="332" height="372" fill="#0f0f18"/>
</svg>
