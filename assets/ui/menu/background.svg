<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Dark atmospheric background like Minecraft Dungeons -->

  <!-- Gradient sky - dark blue to black -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d15;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0505;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="torchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6600;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#ff3300;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ff0000;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <circle cx="100" cy="50" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="200" cy="80" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="350" cy="30" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="500" cy="90" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="650" cy="40" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="800" cy="70" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="950" cy="25" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="1100" cy="85" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="1200" cy="55" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="150" cy="120" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="450" cy="150" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="750" cy="130" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="1050" cy="140" r="1" fill="#ffffff" opacity="0.5"/>

  <!-- Ground -->
  <rect x="0" y="500" width="1280" height="220" fill="url(#groundGrad)"/>

  <!-- Distant mountains/structures silhouette -->
  <polygon points="0,400 100,350 200,380 300,320 400,360 500,300 600,340 700,280 800,350 900,310 1000,370 1100,330 1200,380 1280,350 1280,500 0,500" fill="#0a0a10" opacity="0.8"/>

  <!-- Torch glow left -->
  <ellipse cx="80" cy="450" rx="100" ry="80" fill="url(#torchGlow)"/>
  <!-- Torch left -->
  <rect x="75" y="420" width="10" height="40" fill="#4a3520"/>
  <rect x="73" y="410" width="14" height="15" fill="#ff6600"/>
  <rect x="75" y="405" width="10" height="8" fill="#ffaa00"/>

  <!-- Torch glow right -->
  <ellipse cx="1200" cy="450" rx="100" ry="80" fill="url(#torchGlow)"/>
  <!-- Torch right -->
  <rect x="1195" y="420" width="10" height="40" fill="#4a3520"/>
  <rect x="1193" y="410" width="14" height="15" fill="#ff6600"/>
  <rect x="1195" y="405" width="10" height="8" fill="#ffaa00"/>

  <!-- Zombie silhouette left -->
  <g transform="translate(150, 480)" opacity="0.6">
    <rect x="0" y="0" width="20" height="24" fill="#1a1a1a"/>
    <rect x="-2" y="24" width="24" height="32" fill="#1a1a1a"/>
    <rect x="-8" y="26" width="6" height="24" fill="#1a1a1a"/>
    <rect x="22" y="26" width="6" height="24" fill="#1a1a1a"/>
    <rect x="2" y="56" width="8" height="20" fill="#1a1a1a"/>
    <rect x="12" y="56" width="8" height="20" fill="#1a1a1a"/>
  </g>

  <!-- Zombie silhouette right -->
  <g transform="translate(1050, 490)" opacity="0.5">
    <rect x="0" y="0" width="24" height="28" fill="#1a1a1a"/>
    <rect x="-2" y="28" width="28" height="36" fill="#1a1a1a"/>
    <rect x="-10" y="30" width="8" height="28" fill="#1a1a1a"/>
    <rect x="26" y="30" width="8" height="28" fill="#1a1a1a"/>
    <rect x="2" y="64" width="10" height="24" fill="#1a1a1a"/>
    <rect x="14" y="64" width="10" height="24" fill="#1a1a1a"/>
  </g>

  <!-- Skeleton silhouette center-left -->
  <g transform="translate(300, 510)" opacity="0.4">
    <rect x="4" y="0" width="12" height="14" fill="#1a1a1a"/>
    <rect x="6" y="14" width="8" height="20" fill="#1a1a1a"/>
    <rect x="0" y="16" width="20" height="6" fill="#1a1a1a"/>
    <rect x="-4" y="22" width="4" height="16" fill="#1a1a1a"/>
    <rect x="20" y="22" width="4" height="16" fill="#1a1a1a"/>
    <rect x="4" y="34" width="4" height="16" fill="#1a1a1a"/>
    <rect x="12" y="34" width="4" height="16" fill="#1a1a1a"/>
  </g>

  <!-- Creeper silhouette center-right -->
  <g transform="translate(950, 500)" opacity="0.45">
    <rect x="0" y="0" width="20" height="20" fill="#1a1a1a"/>
    <rect x="2" y="20" width="16" height="24" fill="#1a1a1a"/>
    <rect x="2" y="44" width="6" height="12" fill="#1a1a1a"/>
    <rect x="12" y="44" width="6" height="12" fill="#1a1a1a"/>
  </g>

  <!-- Fog/mist at bottom -->
  <rect x="0" y="650" width="1280" height="70" fill="#1a1a2e" opacity="0.4"/>
  <rect x="0" y="680" width="1280" height="40" fill="#0a0a15" opacity="0.6"/>

  <!-- Vignette effect -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.7" />
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="url(#vignette)"/>
</svg>
