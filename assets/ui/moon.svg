<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Moon - UI Icon - Minecraft Survivors -->

  <!-- Moon body (crescent shape using overlapping rects) -->
  <rect x="8" y="4" width="16" height="24" fill="#E8E8D0"/>

  <!-- Inner moon (lighter) -->
  <rect x="10" y="6" width="12" height="20" fill="#F4F4E8"/>

  <!-- Shadow to create crescent (dark blue/night sky) -->
  <rect x="16" y="6" width="10" height="20" fill="#1A1A2E"/>
  <rect x="14" y="4" width="12" height="4" fill="#1A1A2E"/>
  <rect x="14" y="24" width="12" height="4" fill="#1A1A2E"/>

  <!-- Moon surface details (craters) -->
  <rect x="10" y="10" width="3" height="2" fill="#D4D4C0"/>
  <rect x="11" y="16" width="2" height="2" fill="#D4D4C0"/>
  <rect x="9" y="20" width="2" height="1" fill="#D4D4C0"/>

  <!-- Glow effect -->
  <rect x="7" y="8" width="1" height="2" fill="#F4F4E8" opacity="0.4"/>
  <rect x="6" y="14" width="1" height="3" fill="#F4F4E8" opacity="0.4"/>
  <rect x="7" y="22" width="1" height="2" fill="#F4F4E8" opacity="0.4"/>

  <!-- Stars around moon -->
  <rect x="22" y="8" width="1" height="1" fill="#FFFFFF"/>
  <rect x="26" y="14" width="1" height="1" fill="#FFFFFF"/>
  <rect x="24" y="22" width="1" height="1" fill="#FFFFFF"/>
  <rect x="4" y="6" width="1" height="1" fill="#FFFFFF"/>
  <rect x="2" y="18" width="1" height="1" fill="#FFFFFF"/>
</svg>
