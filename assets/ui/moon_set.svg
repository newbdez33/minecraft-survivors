<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Moon Set - UI Icon - Moon fading with dawn approaching -->

  <!-- Dawn glow at bottom -->
  <rect x="0" y="24" width="32" height="2" fill="#FF9060" opacity="0.2"/>
  <rect x="0" y="26" width="32" height="2" fill="#FFB080" opacity="0.3"/>
  <rect x="0" y="28" width="32" height="4" fill="#FFC090" opacity="0.2"/>

  <!-- Moon body (fading) -->
  <rect x="8" y="4" width="16" height="24" fill="#8898A8"/>

  <!-- Inner moon (lighter, washed out) -->
  <rect x="10" y="6" width="12" height="20" fill="#A0B0C0"/>

  <!-- Shadow to create crescent (lightening sky) -->
  <rect x="16" y="6" width="10" height="20" fill="#303050"/>
  <rect x="14" y="4" width="12" height="4" fill="#303050"/>
  <rect x="14" y="24" width="12" height="4" fill="#303050"/>

  <!-- Moon surface details (faint) -->
  <rect x="10" y="10" width="3" height="2" fill="#7088A0"/>
  <rect x="11" y="16" width="2" height="2" fill="#7088A0"/>

  <!-- Fading stars -->
  <rect x="24" y="8" width="1" height="1" fill="#FFFFFF" opacity="0.3"/>
  <rect x="4" y="6" width="1" height="1" fill="#FFFFFF" opacity="0.3"/>
</svg>
