<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Moon Rise - UI Icon - Moon with sunset glow -->

  <!-- Sunset glow at bottom -->
  <rect x="0" y="26" width="32" height="2" fill="#FF6040" opacity="0.3"/>
  <rect x="0" y="28" width="32" height="2" fill="#804040" opacity="0.2"/>

  <!-- Moon body (crescent shape) -->
  <rect x="8" y="4" width="16" height="24" fill="#7888A0"/>

  <!-- Inner moon (lighter) -->
  <rect x="10" y="6" width="12" height="20" fill="#90A0B8"/>

  <!-- Shadow to create crescent (twilight sky) -->
  <rect x="16" y="6" width="10" height="20" fill="#2A2A4E"/>
  <rect x="14" y="4" width="12" height="4" fill="#2A2A4E"/>
  <rect x="14" y="24" width="12" height="4" fill="#2A2A4E"/>

  <!-- Moon surface details -->
  <rect x="10" y="10" width="3" height="2" fill="#6078A0"/>
  <rect x="11" y="16" width="2" height="2" fill="#6078A0"/>
  <rect x="9" y="20" width="2" height="1" fill="#6078A0"/>

  <!-- Few stars (faint) -->
  <rect x="24" y="8" width="1" height="1" fill="#FFFFFF" opacity="0.5"/>
  <rect x="26" y="16" width="1" height="1" fill="#FFFFFF" opacity="0.5"/>
</svg>
