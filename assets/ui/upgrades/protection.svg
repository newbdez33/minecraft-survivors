<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Protection: Iron shield with cross -->
  <!-- Shield outline -->
  <rect x="6" y="4" width="20" height="4" fill="#a8a8a8"/>
  <rect x="4" y="8" width="24" height="4" fill="#a8a8a8"/>
  <rect x="4" y="12" width="24" height="4" fill="#888888"/>
  <rect x="6" y="16" width="20" height="4" fill="#888888"/>
  <rect x="8" y="20" width="16" height="4" fill="#707070"/>
  <rect x="10" y="24" width="12" height="2" fill="#707070"/>
  <rect x="12" y="26" width="8" height="2" fill="#606060"/>
  <rect x="14" y="28" width="4" height="2" fill="#505050"/>

  <!-- Shield highlight (left edge) -->
  <rect x="4" y="8" width="2" height="8" fill="#c0c0c0"/>
  <rect x="6" y="4" width="2" height="4" fill="#c0c0c0"/>
  <rect x="6" y="16" width="2" height="4" fill="#909090"/>

  <!-- Shield dark edge (right) -->
  <rect x="26" y="8" width="2" height="8" fill="#707070"/>
  <rect x="24" y="4" width="2" height="4" fill="#808080"/>

  <!-- Cross emblem (silver) -->
  <rect x="14" y="8" width="4" height="14" fill="#d4d4d4"/>
  <rect x="10" y="12" width="12" height="4" fill="#d4d4d4"/>

  <!-- Cross highlight -->
  <rect x="14" y="8" width="2" height="2" fill="#e8e8e8"/>
  <rect x="10" y="12" width="2" height="2" fill="#e8e8e8"/>

  <!-- Defensive sparkles -->
  <rect x="2" y="2" width="2" height="2" fill="#add8e6"/>
  <rect x="28" y="2" width="2" height="2" fill="#add8e6"/>
  <rect x="0" y="12" width="2" height="2" fill="#87ceeb"/>
  <rect x="30" y="12" width="2" height="2" fill="#87ceeb"/>
</svg>
