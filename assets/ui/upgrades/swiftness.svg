<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Swiftness: Feather/wing with cyan speed lines -->
  <!-- Speed lines (cyan) -->
  <rect x="2" y="14" width="6" height="2" fill="#00ffff"/>
  <rect x="0" y="10" width="4" height="2" fill="#40e0d0"/>
  <rect x="0" y="18" width="4" height="2" fill="#40e0d0"/>
  <rect x="4" y="6" width="4" height="2" fill="#7fffd4"/>
  <rect x="4" y="22" width="4" height="2" fill="#7fffd4"/>

  <!-- Feather quill (white/cream) -->
  <rect x="26" y="4" width="4" height="4" fill="#f5f5dc"/>
  <rect x="24" y="6" width="4" height="4" fill="#fffaf0"/>
  <rect x="22" y="8" width="4" height="4" fill="#fffaf0"/>
  <rect x="20" y="10" width="4" height="4" fill="#fff8dc"/>
  <rect x="18" y="12" width="4" height="4" fill="#fff8dc"/>
  <rect x="16" y="14" width="4" height="4" fill="#faebd7"/>
  <rect x="14" y="16" width="4" height="4" fill="#faebd7"/>
  <rect x="12" y="18" width="4" height="4" fill="#ffe4c4"/>
  <rect x="10" y="20" width="4" height="4" fill="#ffe4c4"/>
  <rect x="8" y="22" width="4" height="4" fill="#deb887"/>
  <rect x="6" y="24" width="4" height="4" fill="#d2b48c"/>

  <!-- Feather spine -->
  <rect x="8" y="22" width="20" height="2" fill="#8b7355"/>
  <rect x="10" y="20" width="2" height="2" fill="#8b7355"/>
  <rect x="28" y="6" width="2" height="2" fill="#8b7355"/>

  <!-- Feather detail lines -->
  <rect x="24" y="8" width="1" height="2" fill="#dcdcdc"/>
  <rect x="20" y="12" width="1" height="2" fill="#dcdcdc"/>
  <rect x="16" y="16" width="1" height="2" fill="#dcdcdc"/>
  <rect x="12" y="20" width="1" height="2" fill="#d2b48c"/>

  <!-- Tip highlight -->
  <rect x="28" y="4" width="2" height="2" fill="#ffffff"/>
</svg>
