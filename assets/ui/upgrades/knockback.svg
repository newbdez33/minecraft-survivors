<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Knockback: Fist with blue force waves -->
  <!-- Blue force waves -->
  <rect x="2" y="10" width="2" height="2" fill="#4488ff"/>
  <rect x="4" y="8" width="2" height="6" fill="#4488ff"/>
  <rect x="6" y="6" width="2" height="10" fill="#6699ff"/>
  <rect x="8" y="8" width="2" height="6" fill="#88aaff"/>

  <!-- Fist (skin tone) -->
  <rect x="12" y="8" width="10" height="12" fill="#e8b88a"/>
  <rect x="11" y="10" width="2" height="8" fill="#d4a574"/>

  <!-- Fingers -->
  <rect x="22" y="10" width="4" height="3" fill="#e8b88a"/>
  <rect x="22" y="14" width="4" height="3" fill="#e8b88a"/>
  <rect x="22" y="18" width="3" height="2" fill="#e8b88a"/>

  <!-- Finger lines -->
  <rect x="22" y="13" width="4" height="1" fill="#d4a574"/>
  <rect x="22" y="17" width="4" height="1" fill="#d4a574"/>

  <!-- Thumb -->
  <rect x="14" y="20" width="4" height="4" fill="#e8b88a"/>
  <rect x="13" y="21" width="2" height="2" fill="#d4a574"/>

  <!-- Knuckle highlights -->
  <rect x="20" y="9" width="2" height="2" fill="#f5d0b0"/>
  <rect x="20" y="13" width="2" height="2" fill="#f5d0b0"/>
  <rect x="20" y="17" width="2" height="2" fill="#f5d0b0"/>

  <!-- Motion lines (blue) -->
  <rect x="26" y="12" width="4" height="2" fill="#4488ff"/>
  <rect x="28" y="8" width="2" height="2" fill="#6699ff"/>
  <rect x="28" y="18" width="2" height="2" fill="#6699ff"/>
</svg>
