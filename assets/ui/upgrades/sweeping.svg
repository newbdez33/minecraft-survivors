<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Sweeping Edge: Sword with purple arc/sweep effect -->
  <!-- Purple sweep arc -->
  <rect x="4" y="6" width="4" height="2" fill="#9932cc"/>
  <rect x="2" y="8" width="4" height="4" fill="#8b008b"/>
  <rect x="4" y="12" width="6" height="4" fill="#9400d3"/>
  <rect x="6" y="16" width="8" height="4" fill="#9932cc"/>
  <rect x="10" y="20" width="8" height="4" fill="#ba55d3"/>
  <rect x="14" y="24" width="6" height="2" fill="#da70d6"/>

  <!-- Sweep sparkles -->
  <rect x="0" y="4" width="2" height="2" fill="#ee82ee"/>
  <rect x="0" y="14" width="2" height="2" fill="#ee82ee"/>
  <rect x="8" y="24" width="2" height="2" fill="#dda0dd"/>

  <!-- Sword blade (iron) -->
  <rect x="24" y="2" width="4" height="4" fill="#c0c0c0"/>
  <rect x="22" y="4" width="4" height="4" fill="#a9a9a9"/>
  <rect x="20" y="6" width="4" height="4" fill="#a9a9a9"/>
  <rect x="18" y="8" width="4" height="4" fill="#808080"/>
  <rect x="16" y="10" width="4" height="4" fill="#808080"/>

  <!-- Blade edge highlight -->
  <rect x="26" y="2" width="2" height="2" fill="#e8e8e8"/>
  <rect x="24" y="4" width="2" height="2" fill="#d3d3d3"/>
  <rect x="22" y="6" width="2" height="2" fill="#c0c0c0"/>

  <!-- Guard (gold) -->
  <rect x="14" y="12" width="6" height="2" fill="#ffd700"/>
  <rect x="12" y="13" width="2" height="2" fill="#daa520"/>
  <rect x="20" y="13" width="2" height="2" fill="#daa520"/>

  <!-- Handle -->
  <rect x="14" y="14" width="4" height="6" fill="#8b4513"/>
  <rect x="13" y="15" width="2" height="4" fill="#654321"/>

  <!-- Pommel -->
  <rect x="13" y="20" width="6" height="2" fill="#ffd700"/>

  <!-- Additional sweep lines -->
  <rect x="2" y="20" width="6" height="2" fill="#9370db" opacity="0.5"/>
  <rect x="4" y="26" width="4" height="2" fill="#9370db" opacity="0.3"/>
</svg>
