<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Sun Dawn - UI Icon - Minecraft Survivors (Soft orange/pink sunrise) -->

  <!-- Sun rays (soft orange) -->
  <rect x="14" y="2" width="4" height="4" fill="#FFA060"/>
  <rect x="14" y="26" width="4" height="4" fill="#FFA060"/>
  <rect x="2" y="14" width="4" height="4" fill="#FFA060"/>
  <rect x="26" y="14" width="4" height="4" fill="#FFA060"/>

  <!-- Diagonal rays (soft) -->
  <rect x="5" y="5" width="3" height="3" fill="#FF9060"/>
  <rect x="24" y="5" width="3" height="3" fill="#FF9060"/>
  <rect x="5" y="24" width="3" height="3" fill="#FF9060"/>
  <rect x="24" y="24" width="3" height="3" fill="#FF9060"/>

  <!-- Sun body (outer - warm orange) -->
  <rect x="9" y="9" width="14" height="14" fill="#FFB070"/>

  <!-- Sun body (inner - soft yellow-orange) -->
  <rect x="11" y="11" width="10" height="10" fill="#FFCC80"/>

  <!-- Sun core (warm) -->
  <rect x="13" y="13" width="6" height="6" fill="#FFE0A0"/>

  <!-- Center highlight (soft pink) -->
  <rect x="14" y="14" width="4" height="4" fill="#FFE8C0"/>

  <!-- Horizon line hint -->
  <rect x="0" y="28" width="32" height="2" fill="#FF8060" opacity="0.4"/>
  <rect x="0" y="30" width="32" height="2" fill="#804040" opacity="0.3"/>
</svg>
