<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Sun Afternoon - UI Icon - Warm yellow-orange, late day -->

  <!-- Sun rays (warm orange-yellow) -->
  <rect x="14" y="2" width="4" height="4" fill="#FFB840"/>
  <rect x="14" y="26" width="4" height="4" fill="#FFB840"/>
  <rect x="2" y="14" width="4" height="4" fill="#FFB840"/>
  <rect x="26" y="14" width="4" height="4" fill="#FFB840"/>

  <!-- Diagonal rays -->
  <rect x="5" y="5" width="3" height="3" fill="#FFA830"/>
  <rect x="24" y="5" width="3" height="3" fill="#FFA830"/>
  <rect x="5" y="24" width="3" height="3" fill="#FFA830"/>
  <rect x="24" y="24" width="3" height="3" fill="#FFA830"/>

  <!-- Sun body (outer - warm) -->
  <rect x="9" y="9" width="14" height="14" fill="#FFC050"/>

  <!-- Sun body (inner) -->
  <rect x="11" y="11" width="10" height="10" fill="#FFD060"/>

  <!-- Sun core -->
  <rect x="13" y="13" width="6" height="6" fill="#FFE080"/>

  <!-- Center highlight -->
  <rect x="14" y="14" width="4" height="4" fill="#FFF0A0"/>
</svg>
