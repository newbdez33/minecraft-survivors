<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Moon Late - UI Icon - Deep night moon with many stars -->

  <!-- Moon body (crescent shape - deep blue-grey) -->
  <rect x="8" y="4" width="16" height="24" fill="#6070888"/>

  <!-- Inner moon -->
  <rect x="10" y="6" width="12" height="20" fill="#8898B0"/>

  <!-- Shadow to create crescent (deep night) -->
  <rect x="16" y="6" width="10" height="20" fill="#101028"/>
  <rect x="14" y="4" width="12" height="4" fill="#101028"/>
  <rect x="14" y="24" width="12" height="4" fill="#101028"/>

  <!-- Moon surface details -->
  <rect x="10" y="10" width="3" height="2" fill="#5068A0"/>
  <rect x="11" y="16" width="2" height="2" fill="#5068A0"/>
  <rect x="9" y="20" width="2" height="1" fill="#5068A0"/>

  <!-- Many stars -->
  <rect x="22" y="6" width="1" height="1" fill="#FFFFFF"/>
  <rect x="26" y="10" width="1" height="1" fill="#FFFFFF"/>
  <rect x="24" y="16" width="1" height="1" fill="#FFFFFF"/>
  <rect x="28" y="20" width="1" height="1" fill="#FFFFFF"/>
  <rect x="22" y="24" width="1" height="1" fill="#FFFFFF"/>
  <rect x="4" y="4" width="1" height="1" fill="#FFFFFF"/>
  <rect x="2" y="12" width="1" height="1" fill="#FFFFFF"/>
  <rect x="3" y="22" width="1" height="1" fill="#FFFFFF"/>
  <rect x="1" y="28" width="1" height="1" fill="#FFFFFF"/>
</svg>
