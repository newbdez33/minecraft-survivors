<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Sima Yi (司马懿) - Dark Strategist - Wave 25 Boss -->
  <!-- Black and purple robes, fan/scroll, cunning face -->

  <!-- Tall scholar hat (black with purple accent) -->
  <rect x="8" y="0" width="16" height="2" fill="#1A1A2E"/>
  <rect x="10" y="0" width="12" height="1" fill="#2A2A3E"/>
  <rect x="11" y="1" width="10" height="1" fill="#1A1A2E"/>
  <!-- Hat vertical piece (guan mao style) -->
  <rect x="13" y="1" width="6" height="3" fill="#1A1A2E"/>
  <rect x="14" y="1" width="4" height="2" fill="#2D1F4E"/>

  <!-- Face (pale, cunning) -->
  <rect x="10" y="4" width="12" height="8" fill="#E8D5B8"/>

  <!-- Narrow cunning eyes -->
  <rect x="11" y="6" width="4" height="1" fill="#1A1A1A"/>
  <rect x="12" y="6" width="2" height="2" fill="#1A1A2E"/>
  <rect x="12" y="7" width="2" height="1" fill="#3D2B5E"/>
  <rect x="17" y="6" width="4" height="1" fill="#1A1A1A"/>
  <rect x="18" y="6" width="2" height="2" fill="#1A1A2E"/>
  <rect x="18" y="7" width="2" height="1" fill="#3D2B5E"/>
  <!-- Thin arched eyebrows -->
  <rect x="11" y="5" width="4" height="1" fill="#2A2A2A"/>
  <rect x="17" y="5" width="4" height="1" fill="#2A2A2A"/>

  <!-- Thin nose -->
  <rect x="15" y="8" width="2" height="2" fill="#D4C0A0"/>

  <!-- Thin smirk (cunning) -->
  <rect x="13" y="10" width="6" height="1" fill="#8B5050"/>
  <rect x="12" y="10" width="1" height="1" fill="#D4C0A0"/>
  <rect x="19" y="10" width="1" height="1" fill="#D4C0A0"/>

  <!-- Thin goatee -->
  <rect x="14" y="11" width="4" height="1" fill="#2A2A2A"/>
  <rect x="15" y="12" width="2" height="1" fill="#333333"/>

  <!-- Neck -->
  <rect x="13" y="12" width="6" height="1" fill="#E8D5B8"/>

  <!-- Robe body (black and purple, flowing) -->
  <rect x="6" y="13" width="20" height="17" fill="#1A1A2E"/>
  <rect x="8" y="14" width="16" height="15" fill="#22223A"/>

  <!-- Purple inner robe visible at front -->
  <rect x="12" y="14" width="8" height="12" fill="#3D2B5E"/>
  <rect x="13" y="15" width="6" height="10" fill="#4A3570"/>

  <!-- Robe collar (high, dark) -->
  <rect x="10" y="13" width="4" height="2" fill="#2D1F4E"/>
  <rect x="18" y="13" width="4" height="2" fill="#2D1F4E"/>

  <!-- Dark sash/belt -->
  <rect x="8" y="22" width="16" height="2" fill="#1A1A2E"/>
  <rect x="14" y="22" width="4" height="2" fill="#3D2B5E"/>
  <!-- Jade pendant -->
  <rect x="15" y="22" width="2" height="1" fill="#50C878"/>

  <!-- Sleeves (wide, flowing) -->
  <rect x="3" y="15" width="5" height="8" fill="#1A1A2E"/>
  <rect x="4" y="16" width="3" height="6" fill="#22223A"/>
  <rect x="24" y="15" width="5" height="8" fill="#1A1A2E"/>
  <rect x="25" y="16" width="3" height="6" fill="#22223A"/>
  <!-- Purple trim on sleeves -->
  <rect x="3" y="22" width="5" height="1" fill="#3D2B5E"/>
  <rect x="24" y="22" width="5" height="1" fill="#3D2B5E"/>

  <!-- Left hand holding feather fan (iconic Sima Yi accessory) -->
  <rect x="2" y="23" width="3" height="1" fill="#E8D5B8"/>
  <!-- Feather fan -->
  <rect x="0" y="19" width="3" height="4" fill="#F5F5DC"/>
  <rect x="0" y="19" width="1" height="4" fill="#E8E8C8"/>
  <rect x="1" y="20" width="1" height="3" fill="#FFFFF0"/>
  <rect x="2" y="21" width="1" height="2" fill="#E8E8C8"/>
  <!-- Fan handle -->
  <rect x="1" y="23" width="1" height="2" fill="#5C3A1E"/>

  <!-- Right hand -->
  <rect x="27" y="23" width="3" height="1" fill="#E8D5B8"/>

  <!-- Robe bottom (dark flowing) -->
  <rect x="8" y="28" width="16" height="1" fill="#3D2B5E"/>
  <rect x="6" y="29" width="20" height="1" fill="#1A1A2E"/>

  <!-- Shoes (hidden under robe, dark) -->
  <rect x="10" y="30" width="5" height="2" fill="#111122"/>
  <rect x="17" y="30" width="5" height="2" fill="#111122"/>
</svg>