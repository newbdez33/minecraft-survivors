<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Elder Guardian - Large aquatic mob with spikes and laser eye -->
  <!-- Based on Minecraft Elder Guardian: pale cyan/gray color, one large eye, spikes all around -->

  <!-- Main body (blocky fish shape) -->
  <rect x="6" y="8" width="20" height="16" fill="#B8C9C9"/>
  <rect x="8" y="6" width="16" height="2" fill="#A8B8B8"/>
  <rect x="8" y="24" width="16" height="2" fill="#A8B8B8"/>

  <!-- Body shading -->
  <rect x="8" y="10" width="16" height="12" fill="#C9DADA"/>
  <rect x="10" y="12" width="12" height="8" fill="#D4E5E5"/>

  <!-- Large central eye -->
  <rect x="11" y="12" width="10" height="8" fill="#1A1A2E"/>
  <rect x="12" y="13" width="8" height="6" fill="#2D2D44"/>
  <!-- Eye iris (orange/red) -->
  <rect x="14" y="14" width="4" height="4" fill="#E07020"/>
  <rect x="15" y="15" width="2" height="2" fill="#FF9030"/>
  <!-- Eye highlight -->
  <rect x="14" y="14" width="1" height="1" fill="#FFCC80"/>

  <!-- Spikes - Top -->
  <rect x="10" y="2" width="2" height="4" fill="#8A9A9A"/>
  <rect x="15" y="1" width="2" height="5" fill="#8A9A9A"/>
  <rect x="20" y="2" width="2" height="4" fill="#8A9A9A"/>

  <!-- Spikes - Bottom -->
  <rect x="10" y="26" width="2" height="4" fill="#8A9A9A"/>
  <rect x="15" y="26" width="2" height="5" fill="#8A9A9A"/>
  <rect x="20" y="26" width="2" height="4" fill="#8A9A9A"/>

  <!-- Spikes - Left -->
  <rect x="2" y="10" width="4" height="2" fill="#8A9A9A"/>
  <rect x="1" y="15" width="5" height="2" fill="#8A9A9A"/>
  <rect x="2" y="20" width="4" height="2" fill="#8A9A9A"/>

  <!-- Spikes - Right -->
  <rect x="26" y="10" width="4" height="2" fill="#8A9A9A"/>
  <rect x="26" y="15" width="5" height="2" fill="#8A9A9A"/>
  <rect x="26" y="20" width="4" height="2" fill="#8A9A9A"/>

  <!-- Tail fin -->
  <rect x="4" y="14" width="2" height="4" fill="#9AABAB"/>

  <!-- Dark patches (elder guardian markings) -->
  <rect x="8" y="8" width="3" height="2" fill="#7A8A8A"/>
  <rect x="21" y="8" width="3" height="2" fill="#7A8A8A"/>
  <rect x="8" y="22" width="3" height="2" fill="#7A8A8A"/>
  <rect x="21" y="22" width="3" height="2" fill="#7A8A8A"/>
</svg>
