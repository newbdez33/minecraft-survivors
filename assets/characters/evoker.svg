<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Evoker Boss - Top-down view - Minecraft Survivors -->
  <!-- Based on Minecraft Evoker: gray skin, black robe with gold trim, bushy brows -->

  <!-- Head outline (gray illager skin) -->
  <rect x="10" y="2" width="12" height="10" fill="#9B9B9B"/>

  <!-- Face area (slightly lighter gray) -->
  <rect x="11" y="4" width="10" height="8" fill="#A8A8A8"/>

  <!-- Two separate bushy eyebrows (dark brown/black) -->
  <rect x="11" y="5" width="4" height="2" fill="#3D3D3D"/>
  <rect x="17" y="5" width="4" height="2" fill="#3D3D3D"/>

  <!-- Dark eyes -->
  <rect x="12" y="7" width="2" height="2" fill="#2B2B2B"/>
  <rect x="18" y="7" width="2" height="2" fill="#2B2B2B"/>
  <rect x="12" y="7" width="1" height="1" fill="#1A1A1A"/>
  <rect x="18" y="7" width="1" height="1" fill="#1A1A1A"/>

  <!-- Long villager nose (gray) -->
  <rect x="14" y="8" width="4" height="4" fill="#8B8B8B"/>
  <rect x="15" y="12" width="2" height="1" fill="#7A7A7A"/>

  <!-- Robe body (black with dark tones) -->
  <rect x="6" y="13" width="20" height="17" fill="#1A1A1A"/>
  <rect x="8" y="14" width="16" height="15" fill="#252525"/>

  <!-- Gold trim on robe (chest area) -->
  <rect x="8" y="14" width="16" height="1" fill="#DAA520"/>
  <rect x="14" y="15" width="4" height="3" fill="#DAA520"/>
  <rect x="15" y="18" width="2" height="2" fill="#B8860B"/>

  <!-- Gold trim on robe edges -->
  <rect x="6" y="13" width="1" height="17" fill="#DAA520"/>
  <rect x="25" y="13" width="1" height="17" fill="#DAA520"/>

  <!-- Robe folds (dark accents) -->
  <rect x="10" y="20" width="3" height="8" fill="#151515"/>
  <rect x="19" y="20" width="3" height="8" fill="#151515"/>

  <!-- Arms crossed (typical evoker pose) - black sleeves -->
  <rect x="4" y="16" width="4" height="6" fill="#252525"/>
  <rect x="24" y="16" width="4" height="6" fill="#252525"/>

  <!-- Gold trim on sleeves -->
  <rect x="4" y="16" width="4" height="1" fill="#DAA520"/>
  <rect x="24" y="16" width="4" height="1" fill="#DAA520"/>

  <!-- Crossed hands (hidden, gray skin peeking) -->
  <rect x="8" y="18" width="3" height="2" fill="#9B9B9B"/>
  <rect x="21" y="18" width="3" height="2" fill="#9B9B9B"/>

  <!-- Robe bottom hem with gold -->
  <rect x="8" y="29" width="16" height="1" fill="#DAA520"/>

  <!-- Feet/robe bottom -->
  <rect x="11" y="30" width="4" height="2" fill="#1A1A1A"/>
  <rect x="17" y="30" width="4" height="2" fill="#1A1A1A"/>
</svg>
