<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Evoker Boss - Top-down view - Minecraft Survivors -->

  <!-- Hood/Head (gray robe) -->
  <rect x="10" y="2" width="12" height="6" fill="#4A4A4A"/>
  <rect x="8" y="4" width="16" height="4" fill="#5A5A5A"/>

  <!-- Face (pale villager-like) -->
  <rect x="10" y="8" width="12" height="8" fill="#C4A684"/>

  <!-- Eyes (glowing green) -->
  <rect x="12" y="10" width="2" height="2" fill="#00FF00"/>
  <rect x="18" y="10" width="2" height="2" fill="#00FF00"/>
  <rect x="12" y="10" width="1" height="1" fill="#88FF88"/>
  <rect x="18" y="10" width="1" height="1" fill="#88FF88"/>

  <!-- Unibrow (angry evoker look) -->
  <rect x="11" y="9" width="10" height="1" fill="#6B5A4A"/>

  <!-- Nose (villager big nose) -->
  <rect x="14" y="12" width="4" height="3" fill="#A88B6A"/>
  <rect x="15" y="15" width="2" height="1" fill="#8B7355"/>

  <!-- Robe body (dark gray with gold trim) -->
  <rect x="6" y="16" width="20" height="14" fill="#4A4A4A"/>
  <rect x="8" y="16" width="16" height="14" fill="#5A5A5A"/>

  <!-- Gold trim/belt -->
  <rect x="8" y="18" width="16" height="2" fill="#DAA520"/>
  <rect x="14" y="20" width="4" height="2" fill="#DAA520"/>

  <!-- Robe pattern (dark accents) -->
  <rect x="10" y="22" width="4" height="6" fill="#3A3A3A"/>
  <rect x="18" y="22" width="4" height="6" fill="#3A3A3A"/>

  <!-- Arms (raised, casting pose) -->
  <rect x="2" y="14" width="4" height="8" fill="#5A5A5A"/>
  <rect x="26" y="14" width="4" height="8" fill="#5A5A5A"/>

  <!-- Hands (pale, casting magic) -->
  <rect x="2" y="12" width="4" height="3" fill="#C4A684"/>
  <rect x="26" y="12" width="4" height="3" fill="#C4A684"/>

  <!-- Magic particles around hands -->
  <rect x="0" y="11" width="2" height="2" fill="#8B00FF"/>
  <rect x="30" y="11" width="2" height="2" fill="#8B00FF"/>
  <rect x="1" y="14" width="1" height="1" fill="#9932CC"/>
  <rect x="30" y="14" width="1" height="1" fill="#9932CC"/>

  <!-- Robe bottom -->
  <rect x="10" y="28" width="5" height="4" fill="#3A3A3A"/>
  <rect x="17" y="28" width="5" height="4" fill="#3A3A3A"/>
</svg>
