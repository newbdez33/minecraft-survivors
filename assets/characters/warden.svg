<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Warden - Blind deep dark mob with sculk textures and glowing soul -->
  <!-- Dark teal/cyan with sculk texture, chest glow, no eyes -->

  <!-- Main body (tall and imposing) -->
  <rect x="8" y="8" width="16" height="20" fill="#0D4D4D"/>
  <rect x="10" y="10" width="12" height="16" fill="#0F5555"/>

  <!-- Sculk texture patches -->
  <rect x="9" y="12" width="2" height="2" fill="#0A3A3A"/>
  <rect x="21" y="12" width="2" height="2" fill="#0A3A3A"/>
  <rect x="11" y="20" width="2" height="2" fill="#0A3A3A"/>
  <rect x="19" y="20" width="2" height="2" fill="#0A3A3A"/>
  <rect x="15" y="24" width="2" height="2" fill="#0A3A3A"/>

  <!-- Head (no eyes - Warden is blind) -->
  <rect x="10" y="2" width="12" height="8" fill="#0D4D4D"/>
  <rect x="12" y="4" width="8" height="4" fill="#0F5555"/>

  <!-- Antennae/tendrils on head -->
  <rect x="11" y="0" width="2" height="3" fill="#1A6666"/>
  <rect x="19" y="0" width="2" height="3" fill="#1A6666"/>
  <rect x="10" y="1" width="1" height="2" fill="#208080"/>
  <rect x="21" y="1" width="1" height="2" fill="#208080"/>

  <!-- Mouth area (sculk-covered) -->
  <rect x="13" y="6" width="6" height="3" fill="#0A3A3A"/>
  <rect x="14" y="7" width="4" height="1" fill="#082828"/>

  <!-- Glowing soul/chest (cyan glow - key feature) -->
  <rect x="12" y="12" width="8" height="6" fill="#00AAAA"/>
  <rect x="13" y="13" width="6" height="4" fill="#00CCCC"/>
  <rect x="14" y="14" width="4" height="2" fill="#00FFFF"/>
  <!-- Soul heart shape hint -->
  <rect x="14" y="13" width="2" height="1" fill="#40FFFF"/>
  <rect x="16" y="13" width="2" height="1" fill="#40FFFF"/>
  <rect x="15" y="15" width="2" height="1" fill="#80FFFF"/>

  <!-- Arms (long and powerful) -->
  <rect x="4" y="10" width="4" height="14" fill="#0D4D4D"/>
  <rect x="5" y="12" width="2" height="10" fill="#0F5555"/>
  <rect x="24" y="10" width="4" height="14" fill="#0D4D4D"/>
  <rect x="25" y="12" width="2" height="10" fill="#0F5555"/>

  <!-- Hands -->
  <rect x="3" y="22" width="5" height="4" fill="#0A3A3A"/>
  <rect x="24" y="22" width="5" height="4" fill="#0A3A3A"/>

  <!-- Legs -->
  <rect x="10" y="26" width="4" height="6" fill="#0A3A3A"/>
  <rect x="11" y="28" width="2" height="4" fill="#082828"/>
  <rect x="18" y="26" width="4" height="6" fill="#0A3A3A"/>
  <rect x="19" y="28" width="2" height="4" fill="#082828"/>

  <!-- Glowing sculk veins on body -->
  <rect x="9" y="16" width="1" height="3" fill="#20A0A0"/>
  <rect x="22" y="16" width="1" height="3" fill="#20A0A0"/>
</svg>
