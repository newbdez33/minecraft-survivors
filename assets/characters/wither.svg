<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Wither - Three-headed skeleton boss -->
  <!-- Black/dark gray with three skulls, ribcage body -->

  <!-- Central body/spine -->
  <rect x="13" y="12" width="6" height="14" fill="#1A1A1A"/>
  <rect x="14" y="14" width="4" height="10" fill="#252525"/>

  <!-- Ribcage -->
  <rect x="10" y="14" width="12" height="2" fill="#2A2A2A"/>
  <rect x="11" y="17" width="10" height="2" fill="#2A2A2A"/>
  <rect x="12" y="20" width="8" height="2" fill="#2A2A2A"/>
  <!-- Rib shading -->
  <rect x="10" y="14" width="1" height="2" fill="#3A3A3A"/>
  <rect x="21" y="14" width="1" height="2" fill="#3A3A3A"/>

  <!-- Center head (main skull) -->
  <rect x="11" y="2" width="10" height="10" fill="#0A0A0A"/>
  <rect x="12" y="3" width="8" height="8" fill="#151515"/>
  <!-- Center skull eyes -->
  <rect x="13" y="5" width="3" height="3" fill="#1A1A1A"/>
  <rect x="16" y="5" width="3" height="3" fill="#1A1A1A"/>
  <rect x="14" y="6" width="2" height="2" fill="#404040"/>
  <rect x="16" y="6" width="2" height="2" fill="#404040"/>
  <!-- Center skull nose -->
  <rect x="15" y="8" width="2" height="2" fill="#0A0A0A"/>
  <!-- Center skull mouth -->
  <rect x="13" y="10" width="6" height="1" fill="#050505"/>

  <!-- Left head (smaller skull) -->
  <rect x="1" y="4" width="8" height="8" fill="#0A0A0A"/>
  <rect x="2" y="5" width="6" height="6" fill="#151515"/>
  <!-- Left skull eyes -->
  <rect x="3" y="6" width="2" height="2" fill="#404040"/>
  <rect x="5" y="6" width="2" height="2" fill="#404040"/>
  <!-- Left skull nose/mouth -->
  <rect x="4" y="8" width="2" height="1" fill="#0A0A0A"/>
  <rect x="3" y="9" width="4" height="1" fill="#050505"/>
  <!-- Left neck connection -->
  <rect x="8" y="8" width="3" height="4" fill="#1A1A1A"/>

  <!-- Right head (smaller skull) -->
  <rect x="23" y="4" width="8" height="8" fill="#0A0A0A"/>
  <rect x="24" y="5" width="6" height="6" fill="#151515"/>
  <!-- Right skull eyes -->
  <rect x="25" y="6" width="2" height="2" fill="#404040"/>
  <rect x="27" y="6" width="2" height="2" fill="#404040"/>
  <!-- Right skull nose/mouth -->
  <rect x="26" y="8" width="2" height="1" fill="#0A0A0A"/>
  <rect x="25" y="9" width="4" height="1" fill="#050505"/>
  <!-- Right neck connection -->
  <rect x="21" y="8" width="3" height="4" fill="#1A1A1A"/>

  <!-- Wither effect aura (dark particles) -->
  <rect x="6" y="14" width="2" height="2" fill="#202020"/>
  <rect x="24" y="14" width="2" height="2" fill="#202020"/>
  <rect x="4" y="18" width="2" height="2" fill="#181818"/>
  <rect x="26" y="18" width="2" height="2" fill="#181818"/>

  <!-- Lower body/tail -->
  <rect x="14" y="24" width="4" height="4" fill="#1A1A1A"/>
  <rect x="15" y="26" width="2" height="4" fill="#151515"/>
  <rect x="15" y="28" width="2" height="2" fill="#101010"/>

  <!-- Dark energy glow under skulls -->
  <rect x="4" y="12" width="6" height="1" fill="#303030"/>
  <rect x="22" y="12" width="6" height="1" fill="#303030"/>
</svg>
