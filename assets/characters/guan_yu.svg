<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Guan Yu - Three Kingdoms Survivors -->

  <!-- Golden headband/crown -->
  <rect x="9" y="3" width="14" height="2" fill="#DAA520"/>
  <rect x="13" y="2" width="6" height="1" fill="#FFD700"/>
  <rect x="11" y="3" width="2" height="1" fill="#FFD700"/>
  <rect x="19" y="3" width="2" height="1" fill="#FFD700"/>

  <!-- Hair (black, visible at sides) -->
  <rect x="8" y="5" width="16" height="3" fill="#1A1A1A"/>
  <rect x="7" y="6" width="1" height="4" fill="#1A1A1A"/>
  <rect x="24" y="6" width="1" height="4" fill="#1A1A1A"/>

  <!-- Red face (iconic feature) -->
  <rect x="8" y="8" width="16" height="8" fill="#CC3333"/>

  <!-- Eyes -->
  <rect x="11" y="10" width="3" height="2" fill="#FFFFFF"/>
  <rect x="18" y="10" width="3" height="2" fill="#FFFFFF"/>
  <rect x="12" y="10" width="2" height="2" fill="#1A1A1A"/>
  <rect x="18" y="10" width="2" height="2" fill="#1A1A1A"/>

  <!-- Eyebrows (thick, fierce) -->
  <rect x="11" y="9" width="4" height="1" fill="#1A1A1A"/>
  <rect x="17" y="9" width="4" height="1" fill="#1A1A1A"/>

  <!-- Long black beard (flowing down) -->
  <rect x="10" y="14" width="12" height="2" fill="#1A1A1A"/>
  <rect x="11" y="16" width="10" height="2" fill="#1A1A1A"/>
  <rect x="12" y="18" width="8" height="1" fill="#1A1A1A"/>
  <rect x="13" y="19" width="6" height="1" fill="#222222"/>
  <rect x="14" y="20" width="4" height="1" fill="#2A2A2A"/>

  <!-- Green robe (body) -->
  <rect x="6" y="16" width="4" height="10" fill="#2D5A1E"/>
  <rect x="22" y="16" width="4" height="10" fill="#2D5A1E"/>
  <rect x="10" y="18" width="12" height="8" fill="#2D5A1E"/>
  <!-- Robe collar detail -->
  <rect x="10" y="16" width="1" height="2" fill="#3A7A28"/>
  <rect x="21" y="16" width="1" height="2" fill="#3A7A28"/>
  <!-- Robe center seam -->
  <rect x="15" y="20" width="2" height="6" fill="#245016"/>
  <!-- Robe trim (gold accents) -->
  <rect x="10" y="18" width="12" height="1" fill="#B8860B"/>

  <!-- Arms (robe sleeves) -->
  <rect x="4" y="18" width="2" height="6" fill="#2D5A1E"/>
  <rect x="26" y="18" width="2" height="6" fill="#2D5A1E"/>
  <!-- Hands -->
  <rect x="4" y="24" width="2" height="1" fill="#CC3333"/>
  <rect x="26" y="24" width="2" height="1" fill="#CC3333"/>

  <!-- Legs/boots (dark) -->
  <rect x="10" y="26" width="5" height="4" fill="#1A3A0E"/>
  <rect x="17" y="26" width="5" height="4" fill="#1A3A0E"/>
</svg>