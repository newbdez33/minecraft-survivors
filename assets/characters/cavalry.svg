<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" width="48" height="32" shape-rendering="crispEdges">
  <!-- Cavalry (骑兵) - Top-down view - Cao Cao's mounted soldier -->

  <!-- Horse body (brown) -->
  <rect x="14" y="10" width="20" height="14" fill="#6B4423"/>
  <rect x="16" y="8" width="16" height="2" fill="#7B5433"/>
  <rect x="16" y="24" width="16" height="2" fill="#7B5433"/>

  <!-- Horse head (front) -->
  <rect x="12" y="4" width="8" height="6" fill="#7B5433"/>
  <rect x="10" y="5" width="4" height="4" fill="#6B4423"/>
  <!-- Horse ears -->
  <rect x="12" y="2" width="2" height="3" fill="#5B3413"/>
  <rect x="18" y="2" width="2" height="3" fill="#5B3413"/>
  <!-- Horse eyes -->
  <rect x="11" y="6" width="2" height="2" fill="#1A1A1A"/>
  <!-- Horse nostril -->
  <rect x="10" y="8" width="2" height="1" fill="#4A2A13"/>

  <!-- Horse mane -->
  <rect x="14" y="4" width="2" height="6" fill="#3A1A03"/>
  <rect x="16" y="6" width="2" height="4" fill="#3A1A03"/>

  <!-- Horse legs (extending to sides) -->
  <!-- Left legs -->
  <rect x="6" y="12" width="8" height="3" fill="#5B3413"/>
  <rect x="4" y="11" width="4" height="2" fill="#4A2A13"/>
  <rect x="6" y="20" width="8" height="3" fill="#5B3413"/>
  <rect x="4" y="21" width="4" height="2" fill="#4A2A13"/>

  <!-- Right legs -->
  <rect x="34" y="12" width="8" height="3" fill="#5B3413"/>
  <rect x="40" y="11" width="4" height="2" fill="#4A2A13"/>
  <rect x="34" y="20" width="8" height="3" fill="#5B3413"/>
  <rect x="40" y="21" width="4" height="2" fill="#4A2A13"/>

  <!-- Horse tail -->
  <rect x="34" y="14" width="4" height="4" fill="#3A1A03"/>
  <rect x="36" y="13" width="4" height="6" fill="#3A1A03"/>

  <!-- Saddle -->
  <rect x="20" y="9" width="10" height="14" fill="#4A2020"/>
  <rect x="22" y="8" width="6" height="2" fill="#5A3030"/>

  <!-- Rider armor torso (gray metal) -->
  <rect x="22" y="10" width="8" height="8" fill="#888888"/>
  <rect x="24" y="10" width="4" height="8" fill="#999999"/>
  <!-- Armor detail -->
  <rect x="25" y="12" width="2" height="4" fill="#777777"/>

  <!-- Rider head -->
  <rect x="23" y="5" width="6" height="5" fill="#D4A574"/>
  <!-- Helmet -->
  <rect x="23" y="3" width="6" height="3" fill="#777777"/>
  <rect x="24" y="2" width="4" height="2" fill="#888888"/>
  <!-- Helmet crest -->
  <rect x="25" y="0" width="2" height="3" fill="#CC2222"/>
  <!-- Eyes -->
  <rect x="24" y="7" width="2" height="1" fill="#1A1A1A"/>
  <rect x="26" y="7" width="2" height="1" fill="#1A1A1A"/>

  <!-- Rider arms -->
  <rect x="20" y="12" width="2" height="4" fill="#D4A574"/>
  <rect x="30" y="12" width="2" height="4" fill="#D4A574"/>

  <!-- Rider spear (extending forward) -->
  <rect x="10" y="12" width="12" height="2" fill="#6B5535"/>
  <!-- Spear tip -->
  <rect x="8" y="11" width="3" height="4" fill="#AAAAAA"/>
  <rect x="7" y="12" width="1" height="2" fill="#C0C0C0"/>

  <!-- Rider legs on horse sides -->
  <rect x="21" y="18" width="2" height="4" fill="#555555"/>
  <rect x="29" y="18" width="2" height="4" fill="#555555"/>
  <!-- Boots -->
  <rect x="20" y="22" width="3" height="2" fill="#3A3A3A"/>
  <rect x="29" y="22" width="3" height="2" fill="#3A3A3A"/>
</svg>