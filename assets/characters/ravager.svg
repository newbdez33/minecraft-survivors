<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Ravager - Large hostile beast mob from Minecraft raids -->
  <!-- Gray/brown coloring, large horns, bovine-like appearance -->

  <!-- Main body (large and bulky) -->
  <rect x="4" y="12" width="24" height="14" fill="#5A5A5A"/>
  <rect x="6" y="14" width="20" height="10" fill="#6B6B6B"/>

  <!-- Body texture/shading -->
  <rect x="8" y="16" width="6" height="4" fill="#5A5A5A"/>
  <rect x="18" y="16" width="6" height="4" fill="#5A5A5A"/>

  <!-- Head (blocky, aggressive) -->
  <rect x="8" y="4" width="16" height="10" fill="#707070"/>
  <rect x="10" y="6" width="12" height="6" fill="#808080"/>

  <!-- Horns (curved outward) -->
  <rect x="4" y="2" width="4" height="3" fill="#4A4A4A"/>
  <rect x="2" y="4" width="4" height="4" fill="#5A5A5A"/>
  <rect x="24" y="2" width="4" height="3" fill="#4A4A4A"/>
  <rect x="26" y="4" width="4" height="4" fill="#5A5A5A"/>

  <!-- Eyes (angry red) -->
  <rect x="10" y="7" width="4" height="3" fill="#2A0A0A"/>
  <rect x="18" y="7" width="4" height="3" fill="#2A0A0A"/>
  <rect x="11" y="8" width="2" height="2" fill="#8B0000"/>
  <rect x="19" y="8" width="2" height="2" fill="#8B0000"/>

  <!-- Nose/snout -->
  <rect x="12" y="10" width="8" height="4" fill="#606060"/>
  <rect x="13" y="12" width="2" height="2" fill="#404040"/>
  <rect x="17" y="12" width="2" height="2" fill="#404040"/>

  <!-- Mouth (with teeth) -->
  <rect x="11" y="13" width="10" height="2" fill="#303030"/>
  <rect x="12" y="13" width="2" height="1" fill="#E0E0E0"/>
  <rect x="15" y="13" width="2" height="1" fill="#E0E0E0"/>
  <rect x="18" y="13" width="2" height="1" fill="#E0E0E0"/>

  <!-- Front legs (thick) -->
  <rect x="6" y="24" width="5" height="6" fill="#505050"/>
  <rect x="7" y="28" width="3" height="2" fill="#404040"/>
  <rect x="21" y="24" width="5" height="6" fill="#505050"/>
  <rect x="22" y="28" width="3" height="2" fill="#404040"/>

  <!-- Back texture -->
  <rect x="10" y="12" width="12" height="2" fill="#5A5A5A"/>

  <!-- Saddle area (raiders ride them) -->
  <rect x="12" y="14" width="8" height="4" fill="#3A2A1A"/>
  <rect x="13" y="15" width="6" height="2" fill="#4A3A2A"/>
</svg>
