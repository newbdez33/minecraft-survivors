<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Zombie - Top-down view - Minecraft Survivors -->

  <!-- Head (green) -->
  <rect x="8" y="4" width="16" height="6" fill="#597D35"/>

  <!-- Face (lighter green) -->
  <rect x="8" y="10" width="16" height="8" fill="#7BC45C"/>

  <!-- Eyes (black, sunken) -->
  <rect x="11" y="11" width="3" height="3" fill="#1A1A1A"/>
  <rect x="18" y="11" width="3" height="3" fill="#1A1A1A"/>

  <!-- Torn shirt (cyan) -->
  <rect x="6" y="18" width="20" height="8" fill="#49A5A5"/>
  <rect x="8" y="20" width="3" height="2" fill="#597D35"/>
  <rect x="21" y="22" width="2" height="3" fill="#597D35"/>

  <!-- Arms (green, stretched forward) -->
  <rect x="2" y="16" width="4" height="4" fill="#7BC45C"/>
  <rect x="26" y="16" width="4" height="4" fill="#7BC45C"/>

  <!-- Pants (blue) -->
  <rect x="10" y="26" width="5" height="4" fill="#3C3C8C"/>
  <rect x="17" y="26" width="5" height="4" fill="#3C3C8C"/>
</svg>