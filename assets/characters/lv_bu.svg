<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Lv Bu (吕布) - Greatest Warrior - Wave 30 Final Boss -->
  <!-- Magnificent gold and red armor, iconic pheasant feather headdress -->
  <!-- Most impressive and detailed design in the game -->

  <!-- Pheasant feather headdress (tall, iconic - key feature) -->
  <!-- Left feather -->
  <rect x="10" y="0" width="2" height="1" fill="#CC2222"/>
  <rect x="11" y="0" width="1" height="1" fill="#FF4444"/>
  <rect x="11" y="1" width="2" height="1" fill="#CC2222"/>
  <rect x="12" y="2" width="1" height="1" fill="#DD3333"/>
  <!-- Right feather -->
  <rect x="20" y="0" width="2" height="1" fill="#CC2222"/>
  <rect x="20" y="0" width="1" height="1" fill="#FF4444"/>
  <rect x="19" y="1" width="2" height="1" fill="#CC2222"/>
  <rect x="19" y="2" width="1" height="1" fill="#DD3333"/>
  <!-- Center feather (tallest) -->
  <rect x="15" y="0" width="2" height="1" fill="#EE3333"/>
  <rect x="15" y="1" width="2" height="1" fill="#FF4444"/>

  <!-- Golden crown/helmet base -->
  <rect x="9" y="2" width="14" height="3" fill="#DAA520"/>
  <rect x="10" y="2" width="12" height="2" fill="#FFD700"/>
  <rect x="14" y="2" width="4" height="1" fill="#FFEC80"/>
  <!-- Crown jewel (red gem center) -->
  <rect x="15" y="3" width="2" height="1" fill="#CC2222"/>
  <!-- Crown side wings -->
  <rect x="7" y="3" width="3" height="2" fill="#DAA520"/>
  <rect x="8" y="3" width="1" height="1" fill="#FFD700"/>
  <rect x="22" y="3" width="3" height="2" fill="#DAA520"/>
  <rect x="23" y="3" width="1" height="1" fill="#FFD700"/>

  <!-- Face (handsome, fierce warrior) -->
  <rect x="10" y="5" width="12" height="7" fill="#D4A574"/>

  <!-- Intense eyes -->
  <rect x="11" y="7" width="3" height="2" fill="#FFFFFF"/>
  <rect x="12" y="7" width="2" height="2" fill="#1A1A1A"/>
  <rect x="12" y="7" width="1" height="1" fill="#440000"/>
  <rect x="18" y="7" width="3" height="2" fill="#FFFFFF"/>
  <rect x="19" y="7" width="2" height="2" fill="#1A1A1A"/>
  <rect x="19" y="7" width="1" height="1" fill="#440000"/>
  <!-- Bold eyebrows -->
  <rect x="11" y="6" width="4" height="1" fill="#1A1A1A"/>
  <rect x="17" y="6" width="4" height="1" fill="#1A1A1A"/>

  <!-- Nose -->
  <rect x="15" y="9" width="2" height="2" fill="#C49564"/>

  <!-- Short beard/chin -->
  <rect x="12" y="11" width="8" height="1" fill="#2A2A2A"/>

  <!-- Neck (gold gorget) -->
  <rect x="11" y="12" width="10" height="1" fill="#DAA520"/>

  <!-- Magnificent gold and red armor body -->
  <rect x="5" y="13" width="22" height="15" fill="#CC2222"/>
  <rect x="7" y="14" width="18" height="13" fill="#DD3333"/>

  <!-- Gold chest plate (ornate) -->
  <rect x="9" y="14" width="14" height="7" fill="#DAA520"/>
  <rect x="10" y="15" width="12" height="5" fill="#FFD700"/>
  <!-- Dragon emblem on chest (darker gold pattern) -->
  <rect x="13" y="15" width="6" height="4" fill="#B8860B"/>
  <rect x="14" y="16" width="4" height="2" fill="#DAA520"/>
  <rect x="15" y="16" width="2" height="2" fill="#FFD700"/>
  <rect x="14" y="15" width="1" height="1" fill="#CC2222"/>
  <rect x="17" y="15" width="1" height="1" fill="#CC2222"/>

  <!-- Red sash/belt with gold buckle -->
  <rect x="7" y="22" width="18" height="2" fill="#AA1111"/>
  <rect x="13" y="22" width="6" height="2" fill="#DAA520"/>
  <rect x="14" y="22" width="4" height="2" fill="#FFD700"/>

  <!-- Massive gold shoulder pauldrons -->
  <rect x="1" y="12" width="6" height="5" fill="#DAA520"/>
  <rect x="2" y="12" width="4" height="4" fill="#FFD700"/>
  <rect x="3" y="12" width="2" height="2" fill="#FFEC80"/>
  <rect x="25" y="12" width="6" height="5" fill="#DAA520"/>
  <rect x="26" y="12" width="4" height="4" fill="#FFD700"/>
  <rect x="27" y="12" width="2" height="2" fill="#FFEC80"/>
  <!-- Red trim on pauldrons -->
  <rect x="1" y="16" width="6" height="1" fill="#CC2222"/>
  <rect x="25" y="16" width="6" height="1" fill="#CC2222"/>

  <!-- Arms (red with gold trim) -->
  <rect x="2" y="17" width="5" height="7" fill="#CC2222"/>
  <rect x="3" y="18" width="3" height="5" fill="#DD3333"/>
  <rect x="25" y="17" width="5" height="7" fill="#CC2222"/>
  <rect x="26" y="18" width="3" height="5" fill="#DD3333"/>
  <!-- Gold arm bands -->
  <rect x="2" y="19" width="5" height="1" fill="#DAA520"/>
  <rect x="25" y="19" width="5" height="1" fill="#DAA520"/>

  <!-- Gold gauntlets -->
  <rect x="1" y="24" width="5" height="2" fill="#DAA520"/>
  <rect x="2" y="24" width="3" height="1" fill="#FFD700"/>
  <rect x="26" y="24" width="5" height="2" fill="#DAA520"/>
  <rect x="27" y="24" width="3" height="1" fill="#FFD700"/>

  <!-- Red tassets/skirt armor -->
  <rect x="7" y="24" width="7" height="3" fill="#CC2222"/>
  <rect x="18" y="24" width="7" height="3" fill="#CC2222"/>
  <rect x="8" y="24" width="5" height="2" fill="#DD3333"/>
  <rect x="19" y="24" width="5" height="2" fill="#DD3333"/>
  <!-- Gold trim on tassets -->
  <rect x="7" y="26" width="7" height="1" fill="#DAA520"/>
  <rect x="18" y="26" width="7" height="1" fill="#DAA520"/>

  <!-- Legs (red armor) -->
  <rect x="9" y="27" width="5" height="5" fill="#AA1111"/>
  <rect x="10" y="28" width="3" height="3" fill="#CC2222"/>
  <rect x="18" y="27" width="5" height="5" fill="#AA1111"/>
  <rect x="19" y="28" width="3" height="3" fill="#CC2222"/>

  <!-- Gold boots -->
  <rect x="9" y="30" width="5" height="2" fill="#B8860B"/>
  <rect x="10" y="30" width="3" height="1" fill="#DAA520"/>
  <rect x="18" y="30" width="5" height="2" fill="#B8860B"/>
  <rect x="19" y="30" width="3" height="1" fill="#DAA520"/>
</svg>