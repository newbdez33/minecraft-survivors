<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Infantry (步兵) - Top-down view - Cao Cao's foot soldier -->

  <!-- Leather cap (brown) -->
  <rect x="10" y="2" width="12" height="4" fill="#6B5335"/>
  <rect x="8" y="4" width="16" height="3" fill="#7A6245"/>

  <!-- Head / Face (skin) -->
  <rect x="9" y="7" width="14" height="7" fill="#D4A574"/>

  <!-- Eyes (dark) -->
  <rect x="12" y="9" width="2" height="2" fill="#1A1A1A"/>
  <rect x="18" y="9" width="2" height="2" fill="#1A1A1A"/>

  <!-- Mouth -->
  <rect x="14" y="12" width="4" height="1" fill="#A07050"/>

  <!-- Armor torso (brown/tan) -->
  <rect x="7" y="14" width="18" height="10" fill="#8B7355"/>
  <!-- Armor center plate -->
  <rect x="12" y="15" width="8" height="8" fill="#9B8365"/>
  <!-- Belt -->
  <rect x="8" y="22" width="16" height="2" fill="#5A4328"/>
  <!-- Belt buckle -->
  <rect x="14" y="22" width="4" height="2" fill="#C8A832"/>

  <!-- Shoulder plates -->
  <rect x="5" y="14" width="4" height="4" fill="#7A6245"/>
  <rect x="23" y="14" width="4" height="4" fill="#7A6245"/>

  <!-- Arms (skin) -->
  <rect x="4" y="18" width="3" height="4" fill="#D4A574"/>
  <rect x="25" y="18" width="3" height="4" fill="#D4A574"/>

  <!-- Right hand holding sword -->
  <rect x="25" y="14" width="2" height="2" fill="#D4A574"/>
  <!-- Sword blade -->
  <rect x="27" y="10" width="2" height="8" fill="#AAAAAA"/>
  <rect x="27" y="8" width="2" height="2" fill="#C0C0C0"/>
  <!-- Sword hilt -->
  <rect x="26" y="18" width="4" height="1" fill="#6B4423"/>
  <rect x="27" y="19" width="2" height="2" fill="#5A3318"/>

  <!-- Pants (dark) -->
  <rect x="10" y="24" width="5" height="4" fill="#4A3728"/>
  <rect x="17" y="24" width="5" height="4" fill="#4A3728"/>

  <!-- Feet -->
  <rect x="10" y="28" width="5" height="2" fill="#3A2718"/>
  <rect x="17" y="28" width="5" height="2" fill="#3A2718"/>
</svg>