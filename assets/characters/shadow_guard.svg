<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Shadow Guard (影卫) - Dark Ghostly Soldier - Summoned Minion -->
  <!-- Translucent dark colors, glowing red eyes, spooky but simple -->

  <!-- Ghostly head (dark, semi-transparent) -->
  <rect x="10" y="3" width="12" height="8" fill="#1A1A1A" fill-opacity="0.8"/>
  <rect x="11" y="4" width="10" height="6" fill="#222222" fill-opacity="0.8"/>

  <!-- Hood/cowl (darker edges) -->
  <rect x="9" y="2" width="14" height="3" fill="#111111" fill-opacity="0.85"/>
  <rect x="10" y="2" width="12" height="2" fill="#1A1A1A" fill-opacity="0.85"/>
  <rect x="8" y="4" width="2" height="4" fill="#111111" fill-opacity="0.8"/>
  <rect x="22" y="4" width="2" height="4" fill="#111111" fill-opacity="0.8"/>

  <!-- Glowing red eyes (key feature - bright against dark) -->
  <rect x="12" y="6" width="3" height="2" fill="#FF0000" fill-opacity="1.0"/>
  <rect x="13" y="6" width="1" height="1" fill="#FF4444" fill-opacity="1.0"/>
  <rect x="19" y="6" width="3" height="2" fill="#FF0000" fill-opacity="1.0"/>
  <rect x="20" y="6" width="1" height="1" fill="#FF4444" fill-opacity="1.0"/>
  <!-- Eye glow aura -->
  <rect x="11" y="6" width="1" height="2" fill="#660000" fill-opacity="0.6"/>
  <rect x="15" y="6" width="1" height="2" fill="#660000" fill-opacity="0.6"/>
  <rect x="18" y="6" width="1" height="2" fill="#660000" fill-opacity="0.6"/>
  <rect x="22" y="6" width="1" height="2" fill="#660000" fill-opacity="0.6"/>

  <!-- Empty face (no nose or mouth - ghostly) -->
  <rect x="14" y="9" width="4" height="1" fill="#0A0A0A" fill-opacity="0.5"/>

  <!-- Body (translucent dark robes) -->
  <rect x="7" y="11" width="18" height="14" fill="#1A1A1A" fill-opacity="0.75"/>
  <rect x="9" y="12" width="14" height="12" fill="#222222" fill-opacity="0.75"/>

  <!-- Chest area (slightly lighter shadow) -->
  <rect x="12" y="13" width="8" height="4" fill="#2A2A2A" fill-opacity="0.7"/>

  <!-- Dark armor fragments (ghostly remnants) -->
  <rect x="10" y="13" width="2" height="3" fill="#333333" fill-opacity="0.8"/>
  <rect x="20" y="13" width="2" height="3" fill="#333333" fill-opacity="0.8"/>
  <rect x="14" y="12" width="4" height="1" fill="#333333" fill-opacity="0.8"/>

  <!-- Arms (wispy, translucent) -->
  <rect x="4" y="13" width="5" height="8" fill="#1A1A1A" fill-opacity="0.7"/>
  <rect x="5" y="14" width="3" height="6" fill="#222222" fill-opacity="0.65"/>
  <rect x="23" y="13" width="5" height="8" fill="#1A1A1A" fill-opacity="0.7"/>
  <rect x="24" y="14" width="3" height="6" fill="#222222" fill-opacity="0.65"/>

  <!-- Ghostly hands (barely visible) -->
  <rect x="3" y="20" width="4" height="2" fill="#1A1A1A" fill-opacity="0.6"/>
  <rect x="25" y="20" width="4" height="2" fill="#1A1A1A" fill-opacity="0.6"/>

  <!-- Wispy lower body (fading into nothing) -->
  <rect x="9" y="24" width="14" height="2" fill="#1A1A1A" fill-opacity="0.6"/>
  <rect x="10" y="26" width="12" height="2" fill="#1A1A1A" fill-opacity="0.45"/>
  <rect x="11" y="28" width="10" height="2" fill="#111111" fill-opacity="0.3"/>
  <rect x="12" y="30" width="8" height="1" fill="#0A0A0A" fill-opacity="0.15"/>
  <rect x="14" y="31" width="4" height="1" fill="#0A0A0A" fill-opacity="0.08"/>

  <!-- Shadow wisps/tendrils (floating dark particles) -->
  <rect x="6" y="22" width="2" height="1" fill="#1A1A1A" fill-opacity="0.4"/>
  <rect x="24" y="23" width="2" height="1" fill="#1A1A1A" fill-opacity="0.4"/>
  <rect x="8" y="27" width="1" height="2" fill="#111111" fill-opacity="0.25"/>
  <rect x="23" y="26" width="1" height="2" fill="#111111" fill-opacity="0.25"/>

  <!-- Faint red energy glow in chest (dark power source) -->
  <rect x="15" y="15" width="2" height="2" fill="#880000" fill-opacity="0.6"/>
  <rect x="15" y="16" width="2" height="1" fill="#AA0000" fill-opacity="0.5"/>
</svg>