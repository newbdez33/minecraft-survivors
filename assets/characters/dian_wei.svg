<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Dian Wei (典韦) - Evil Comes - Wave 20 Boss -->
  <!-- Dual-wielding warrior, dark iron armor, fierce expression, large build -->

  <!-- Head (large, fierce) -->
  <rect x="10" y="2" width="12" height="9" fill="#C49564"/>

  <!-- Dark iron helmet (open face) -->
  <rect x="9" y="1" width="14" height="3" fill="#555555"/>
  <rect x="10" y="1" width="12" height="2" fill="#666666"/>
  <rect x="14" y="0" width="4" height="1" fill="#555555"/>
  <rect x="15" y="0" width="2" height="1" fill="#777777"/>
  <!-- Helmet horn-like protrusions -->
  <rect x="9" y="0" width="2" height="2" fill="#444444"/>
  <rect x="21" y="0" width="2" height="2" fill="#444444"/>
  <!-- Helmet cheek guards -->
  <rect x="8" y="3" width="2" height="4" fill="#555555"/>
  <rect x="22" y="3" width="2" height="4" fill="#555555"/>

  <!-- Fierce eyes (intense) -->
  <rect x="11" y="5" width="3" height="2" fill="#FFFFFF"/>
  <rect x="12" y="5" width="2" height="2" fill="#880000"/>
  <rect x="18" y="5" width="3" height="2" fill="#FFFFFF"/>
  <rect x="19" y="5" width="2" height="2" fill="#880000"/>
  <!-- Heavy scowling brows -->
  <rect x="10" y="4" width="5" height="1" fill="#1A1A1A"/>
  <rect x="17" y="4" width="5" height="1" fill="#1A1A1A"/>

  <!-- Nose (strong) -->
  <rect x="14" y="7" width="4" height="2" fill="#B08554"/>

  <!-- Grimace/snarl -->
  <rect x="12" y="9" width="8" height="1" fill="#6B2020"/>
  <rect x="13" y="9" width="2" height="1" fill="#CCCCCC"/>
  <rect x="17" y="9" width="2" height="1" fill="#CCCCCC"/>

  <!-- Short stubble/beard -->
  <rect x="10" y="10" width="12" height="1" fill="#3A3A3A"/>

  <!-- Thick neck -->
  <rect x="12" y="11" width="8" height="2" fill="#C49564"/>

  <!-- Dark iron armor body (heavy, imposing) -->
  <rect x="5" y="13" width="22" height="15" fill="#555555"/>
  <rect x="7" y="14" width="18" height="13" fill="#666666"/>

  <!-- Chest plate (dark iron with rivets) -->
  <rect x="9" y="14" width="14" height="6" fill="#5A5A5A"/>
  <rect x="10" y="15" width="12" height="4" fill="#6B6B6B"/>
  <!-- Iron studs/rivets pattern -->
  <rect x="10" y="15" width="1" height="1" fill="#888888"/>
  <rect x="13" y="15" width="1" height="1" fill="#888888"/>
  <rect x="18" y="15" width="1" height="1" fill="#888888"/>
  <rect x="21" y="15" width="1" height="1" fill="#888888"/>
  <rect x="11" y="18" width="1" height="1" fill="#888888"/>
  <rect x="15" y="18" width="2" height="1" fill="#888888"/>
  <rect x="20" y="18" width="1" height="1" fill="#888888"/>

  <!-- Belt (dark leather with iron buckle) -->
  <rect x="7" y="21" width="18" height="2" fill="#3A2510"/>
  <rect x="14" y="21" width="4" height="2" fill="#555555"/>
  <rect x="15" y="21" width="2" height="2" fill="#777777"/>

  <!-- Massive shoulder guards (spiked) -->
  <rect x="1" y="12" width="6" height="4" fill="#555555"/>
  <rect x="2" y="12" width="4" height="3" fill="#666666"/>
  <rect x="1" y="11" width="2" height="2" fill="#444444"/>
  <rect x="25" y="12" width="6" height="4" fill="#555555"/>
  <rect x="26" y="12" width="4" height="3" fill="#666666"/>
  <rect x="29" y="11" width="2" height="2" fill="#444444"/>

  <!-- Arms (heavily armored) -->
  <rect x="2" y="16" width="5" height="8" fill="#555555"/>
  <rect x="3" y="17" width="3" height="6" fill="#666666"/>
  <rect x="25" y="16" width="5" height="8" fill="#555555"/>
  <rect x="26" y="17" width="3" height="6" fill="#666666"/>

  <!-- Left weapon - dual halberd (visible at side) -->
  <rect x="0" y="10" width="1" height="16" fill="#777777"/>
  <rect x="0" y="10" width="2" height="3" fill="#888888"/>
  <rect x="0" y="9" width="1" height="2" fill="#999999"/>

  <!-- Right weapon - dual halberd -->
  <rect x="31" y="10" width="1" height="16" fill="#777777"/>
  <rect x="30" y="10" width="2" height="3" fill="#888888"/>
  <rect x="31" y="9" width="1" height="2" fill="#999999"/>

  <!-- Iron gauntlets -->
  <rect x="1" y="24" width="5" height="2" fill="#777777"/>
  <rect x="26" y="24" width="5" height="2" fill="#777777"/>

  <!-- Legs (heavy armor) -->
  <rect x="9" y="26" width="6" height="6" fill="#444444"/>
  <rect x="10" y="27" width="4" height="4" fill="#555555"/>
  <rect x="17" y="26" width="6" height="6" fill="#444444"/>
  <rect x="18" y="27" width="4" height="4" fill="#555555"/>

  <!-- Heavy boots -->
  <rect x="9" y="30" width="6" height="2" fill="#333333"/>
  <rect x="17" y="30" width="6" height="2" fill="#333333"/>
</svg>