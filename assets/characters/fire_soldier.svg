<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Fire Soldier (火兵) - Top-down view - Cao Cao's fire unit -->

  <!-- Head wrap / helmet (red-tinted) -->
  <rect x="10" y="3" width="12" height="4" fill="#882211"/>
  <rect x="9" y="5" width="14" height="3" fill="#993322"/>

  <!-- Face (skin) -->
  <rect x="9" y="8" width="14" height="6" fill="#D4A574"/>

  <!-- Eyes (intense, fiery) -->
  <rect x="12" y="9" width="2" height="2" fill="#FF4400"/>
  <rect x="18" y="9" width="2" height="2" fill="#FF4400"/>
  <!-- Eye pupils -->
  <rect x="12" y="10" width="1" height="1" fill="#1A1A1A"/>
  <rect x="19" y="10" width="1" height="1" fill="#1A1A1A"/>

  <!-- Mouth (grimace) -->
  <rect x="14" y="12" width="4" height="1" fill="#A07050"/>

  <!-- Red-tinted armor -->
  <rect x="7" y="14" width="18" height="10" fill="#CC4422"/>
  <!-- Armor chest plate (darker red) -->
  <rect x="11" y="15" width="10" height="6" fill="#AA3318"/>
  <!-- Fire emblem on chest -->
  <rect x="14" y="16" width="4" height="4" fill="#FF6633"/>
  <rect x="15" y="15" width="2" height="1" fill="#FFAA33"/>
  <rect x="15" y="20" width="2" height="1" fill="#FF6633"/>

  <!-- Belt -->
  <rect x="8" y="22" width="16" height="2" fill="#5A2218"/>
  <rect x="14" y="22" width="4" height="2" fill="#CC8822"/>

  <!-- Shoulder guards (red) -->
  <rect x="5" y="14" width="3" height="4" fill="#993322"/>
  <rect x="24" y="14" width="3" height="4" fill="#993322"/>

  <!-- Left arm (skin) -->
  <rect x="4" y="18" width="3" height="4" fill="#D4A574"/>

  <!-- Right arm holding torch -->
  <rect x="25" y="16" width="3" height="4" fill="#D4A574"/>

  <!-- Torch handle -->
  <rect x="27" y="12" width="2" height="8" fill="#5A3318"/>

  <!-- Torch flames -->
  <rect x="26" y="6" width="4" height="6" fill="#FF6633"/>
  <rect x="27" y="4" width="2" height="3" fill="#FFAA33"/>
  <rect x="28" y="3" width="1" height="2" fill="#FFDD44"/>
  <rect x="26" y="8" width="1" height="2" fill="#FF4400"/>
  <rect x="30" y="7" width="1" height="3" fill="#FF4400"/>
  <!-- Inner flame glow -->
  <rect x="27" y="7" width="2" height="3" fill="#FFCC22"/>
  <rect x="28" y="5" width="1" height="2" fill="#FFEE66"/>

  <!-- Pants (dark, soot-stained) -->
  <rect x="10" y="24" width="5" height="4" fill="#3A2218"/>
  <rect x="17" y="24" width="5" height="4" fill="#3A2218"/>

  <!-- Feet -->
  <rect x="10" y="28" width="5" height="2" fill="#2A1208"/>
  <rect x="17" y="28" width="5" height="2" fill="#2A1208"/>

  <!-- Scattered ember particles -->
  <rect x="2" y="4" width="1" height="1" fill="#FF6633"/>
  <rect x="30" y="2" width="1" height="1" fill="#FFAA33"/>
  <rect x="24" y="5" width="1" height="1" fill="#FF4400"/>
</svg>