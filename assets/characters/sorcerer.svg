<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Sorcerer (术士) - Top-down view - Cao Cao's dark mage -->

  <!-- Ritual headdress (dark blue/purple, Chinese-style) -->
  <rect x="8" y="0" width="16" height="3" fill="#3D2B5E"/>
  <rect x="10" y="1" width="12" height="2" fill="#4D3B6E"/>
  <!-- Headdress wings (side flaps) -->
  <rect x="6" y="3" width="20" height="2" fill="#3D2B5E"/>
  <rect x="5" y="3" width="3" height="3" fill="#2D1B4E"/>
  <rect x="24" y="3" width="3" height="3" fill="#2D1B4E"/>
  <!-- Headdress ornament (gold center) -->
  <rect x="14" y="0" width="4" height="2" fill="#CC9922"/>
  <rect x="15" y="0" width="2" height="1" fill="#EEBB33"/>

  <!-- Face (pale, sickly) -->
  <rect x="10" y="5" width="12" height="8" fill="#C4B494"/>

  <!-- Red glowing eyes -->
  <rect x="12" y="7" width="2" height="2" fill="#AA0000"/>
  <rect x="18" y="7" width="2" height="2" fill="#AA0000"/>
  <!-- Eye glow -->
  <rect x="13" y="7" width="1" height="1" fill="#FF2200"/>
  <rect x="19" y="7" width="1" height="1" fill="#FF2200"/>

  <!-- Thin mouth (sneering) -->
  <rect x="14" y="11" width="4" height="1" fill="#8A7464"/>

  <!-- Dark robe torso -->
  <rect x="7" y="13" width="18" height="12" fill="#3D2B5E"/>
  <rect x="9" y="13" width="14" height="12" fill="#4D3B6E"/>
  <!-- Robe center fold -->
  <rect x="15" y="14" width="2" height="10" fill="#3D2B5E"/>
  <!-- Mystical symbols on robe -->
  <rect x="11" y="16" width="2" height="2" fill="#6644AA"/>
  <rect x="19" y="16" width="2" height="2" fill="#6644AA"/>
  <rect x="13" y="20" width="2" height="2" fill="#6644AA"/>
  <rect x="17" y="20" width="2" height="2" fill="#6644AA"/>

  <!-- Robe sash (gold trim) -->
  <rect x="8" y="18" width="16" height="1" fill="#AA8822"/>

  <!-- Left arm (robe sleeve) -->
  <rect x="4" y="14" width="4" height="6" fill="#3D2B5E"/>
  <!-- Left hand (pale) -->
  <rect x="3" y="18" width="3" height="3" fill="#C4B494"/>
  <!-- Spell orb in left hand -->
  <rect x="2" y="19" width="3" height="3" fill="#4422AA"/>
  <rect x="3" y="18" width="1" height="1" fill="#6644CC"/>

  <!-- Right arm (robe sleeve) -->
  <rect x="24" y="14" width="4" height="6" fill="#3D2B5E"/>
  <!-- Right hand (pale) -->
  <rect x="25" y="18" width="3" height="3" fill="#C4B494"/>

  <!-- Staff (held in right hand) -->
  <rect x="27" y="4" width="2" height="18" fill="#4A3020"/>
  <rect x="27" y="2" width="2" height="3" fill="#3A2010"/>
  <!-- Staff headpiece (glowing crystal) -->
  <rect x="26" y="0" width="4" height="3" fill="#6644AA"/>
  <rect x="27" y="0" width="2" height="1" fill="#9966DD"/>
  <!-- Staff glow particles -->
  <rect x="25" y="1" width="1" height="1" fill="#8855CC"/>
  <rect x="30" y="0" width="1" height="1" fill="#8855CC"/>

  <!-- Robe bottom / legs -->
  <rect x="9" y="25" width="6" height="5" fill="#3D2B5E"/>
  <rect x="17" y="25" width="6" height="5" fill="#3D2B5E"/>
  <!-- Robe hem detail -->
  <rect x="9" y="29" width="14" height="1" fill="#2D1B4E"/>
</svg>