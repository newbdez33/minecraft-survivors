<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Ender Dragon - Final Boss (Wave 30) - Iconic Minecraft dragon -->
  <!-- Black body with purple accents, large wings, glowing purple eyes -->

  <!-- Main body (serpentine) -->
  <rect x="10" y="14" width="12" height="8" fill="#1A0A1A"/>
  <rect x="12" y="16" width="8" height="4" fill="#251525"/>

  <!-- Body scales/texture -->
  <rect x="11" y="15" width="2" height="2" fill="#2A102A"/>
  <rect x="15" y="15" width="2" height="2" fill="#2A102A"/>
  <rect x="19" y="15" width="2" height="2" fill="#2A102A"/>
  <rect x="13" y="19" width="2" height="2" fill="#2A102A"/>
  <rect x="17" y="19" width="2" height="2" fill="#2A102A"/>

  <!-- Left wing (large, bat-like) -->
  <rect x="0" y="8" width="10" height="12" fill="#3D1A3D"/>
  <rect x="1" y="9" width="8" height="10" fill="#4B2A4B"/>
  <!-- Wing membrane lines -->
  <rect x="2" y="10" width="1" height="8" fill="#5A3A5A"/>
  <rect x="5" y="10" width="1" height="8" fill="#5A3A5A"/>
  <rect x="8" y="10" width="1" height="8" fill="#5A3A5A"/>
  <!-- Wing bone -->
  <rect x="0" y="10" width="2" height="2" fill="#1A0A1A"/>
  <rect x="0" y="14" width="2" height="2" fill="#1A0A1A"/>

  <!-- Right wing (large, bat-like) -->
  <rect x="22" y="8" width="10" height="12" fill="#3D1A3D"/>
  <rect x="23" y="9" width="8" height="10" fill="#4B2A4B"/>
  <!-- Wing membrane lines -->
  <rect x="24" y="10" width="1" height="8" fill="#5A3A5A"/>
  <rect x="27" y="10" width="1" height="8" fill="#5A3A5A"/>
  <rect x="30" y="10" width="1" height="8" fill="#5A3A5A"/>
  <!-- Wing bone -->
  <rect x="30" y="10" width="2" height="2" fill="#1A0A1A"/>
  <rect x="30" y="14" width="2" height="2" fill="#1A0A1A"/>

  <!-- Neck -->
  <rect x="12" y="8" width="4" height="6" fill="#1A0A1A"/>
  <rect x="13" y="9" width="2" height="4" fill="#251525"/>

  <!-- Head -->
  <rect x="10" y="2" width="8" height="7" fill="#0D050D"/>
  <rect x="11" y="3" width="6" height="5" fill="#1A0A1A"/>
  <!-- Snout -->
  <rect x="18" y="4" width="4" height="4" fill="#0D050D"/>
  <rect x="19" y="5" width="2" height="2" fill="#1A0A1A"/>

  <!-- Eyes (glowing purple) -->
  <rect x="12" y="4" width="3" height="3" fill="#6B006B"/>
  <rect x="13" y="5" width="2" height="2" fill="#9400D3"/>
  <rect x="13" y="5" width="1" height="1" fill="#DA70D6"/>
  <rect x="16" y="5" width="2" height="2" fill="#9400D3"/>
  <rect x="16" y="5" width="1" height="1" fill="#DA70D6"/>

  <!-- Horns -->
  <rect x="10" y="0" width="2" height="3" fill="#2A002A"/>
  <rect x="9" y="1" width="1" height="2" fill="#3A003A"/>
  <rect x="16" y="0" width="2" height="3" fill="#2A002A"/>
  <rect x="18" y="1" width="1" height="2" fill="#3A003A"/>

  <!-- Mouth/jaw -->
  <rect x="19" y="7" width="3" height="2" fill="#050005"/>
  <!-- Teeth -->
  <rect x="20" y="7" width="1" height="1" fill="#C0C0C0"/>
  <rect x="21" y="8" width="1" height="1" fill="#C0C0C0"/>

  <!-- Tail -->
  <rect x="8" y="20" width="4" height="4" fill="#1A0A1A"/>
  <rect x="5" y="22" width="4" height="3" fill="#150A15"/>
  <rect x="2" y="24" width="4" height="3" fill="#100510"/>
  <rect x="0" y="26" width="3" height="2" fill="#0D050D"/>
  <!-- Tail spikes -->
  <rect x="6" y="21" width="1" height="2" fill="#3A003A"/>
  <rect x="3" y="23" width="1" height="2" fill="#3A003A"/>
  <rect x="0" y="25" width="1" height="2" fill="#3A003A"/>

  <!-- Legs (short, dragon-like) -->
  <rect x="11" y="22" width="3" height="5" fill="#0D050D"/>
  <rect x="12" y="25" width="2" height="3" fill="#050005"/>
  <rect x="10" y="27" width="1" height="2" fill="#050005"/>
  <rect x="18" y="22" width="3" height="5" fill="#0D050D"/>
  <rect x="19" y="25" width="2" height="3" fill="#050005"/>
  <rect x="21" y="27" width="1" height="2" fill="#050005"/>

  <!-- Purple glow effect around dragon -->
  <rect x="9" y="12" width="1" height="2" fill="#6B006B" fill-opacity="0.5"/>
  <rect x="22" y="12" width="1" height="2" fill="#6B006B" fill-opacity="0.5"/>
  <rect x="15" y="22" width="2" height="1" fill="#6B006B" fill-opacity="0.5"/>

  <!-- End crystal energy particles -->
  <rect x="4" y="5" width="1" height="1" fill="#DA70D6"/>
  <rect x="27" y="5" width="1" height="1" fill="#DA70D6"/>
  <rect x="15" y="0" width="1" height="1" fill="#FF00FF"/>
</svg>
