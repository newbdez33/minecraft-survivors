<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Assassin (刺客) - Top-down view - Stealthy warrior, replaces Enderman -->

  <!-- Hood (dark) -->
  <rect x="9" y="2" width="14" height="5" fill="#1A1A1A"/>
  <rect x="8" y="4" width="16" height="4" fill="#2D2D2D"/>
  <!-- Hood point -->
  <rect x="14" y="0" width="4" height="3" fill="#1A1A1A"/>

  <!-- Face area (mostly covered) -->
  <rect x="10" y="8" width="12" height="5" fill="#2D2D2D"/>
  <!-- Exposed skin around eyes -->
  <rect x="11" y="8" width="10" height="3" fill="#C49464"/>

  <!-- Purple eyes (mystical, like enderman) -->
  <rect x="12" y="9" width="2" height="2" fill="#8800FF"/>
  <rect x="18" y="9" width="2" height="2" fill="#8800FF"/>
  <!-- Eye glow highlights -->
  <rect x="13" y="9" width="1" height="1" fill="#AA44FF"/>
  <rect x="19" y="9" width="1" height="1" fill="#AA44FF"/>

  <!-- Face wrap / mask covering lower face -->
  <rect x="10" y="11" width="12" height="3" fill="#1A1A1A"/>
  <rect x="11" y="11" width="10" height="2" fill="#222222"/>

  <!-- Dark outfit torso -->
  <rect x="8" y="14" width="16" height="10" fill="#1A1A1A"/>
  <rect x="10" y="14" width="12" height="10" fill="#2D2D2D"/>
  <!-- Subtle chest strap (diagonal) -->
  <rect x="11" y="15" width="2" height="2" fill="#3D3D3D"/>
  <rect x="13" y="17" width="2" height="2" fill="#3D3D3D"/>
  <rect x="15" y="19" width="2" height="2" fill="#3D3D3D"/>
  <rect x="17" y="21" width="2" height="2" fill="#3D3D3D"/>

  <!-- Wrapped belt with hidden blades -->
  <rect x="9" y="22" width="14" height="2" fill="#333333"/>
  <rect x="13" y="22" width="2" height="2" fill="#555555"/>
  <rect x="17" y="22" width="2" height="2" fill="#555555"/>

  <!-- Arms (dark sleeves) -->
  <rect x="5" y="15" width="3" height="5" fill="#1A1A1A"/>
  <rect x="24" y="15" width="3" height="5" fill="#1A1A1A"/>
  <!-- Hands (skin, holding daggers) -->
  <rect x="4" y="18" width="2" height="3" fill="#C49464"/>
  <rect x="26" y="18" width="2" height="3" fill="#C49464"/>

  <!-- Left dagger -->
  <rect x="3" y="14" width="1" height="5" fill="#AAAAAA"/>
  <rect x="3" y="13" width="1" height="2" fill="#C0C0C0"/>

  <!-- Right dagger -->
  <rect x="28" y="14" width="1" height="5" fill="#AAAAAA"/>
  <rect x="28" y="13" width="1" height="2" fill="#C0C0C0"/>

  <!-- Dark pants -->
  <rect x="10" y="24" width="5" height="4" fill="#1A1A1A"/>
  <rect x="17" y="24" width="5" height="4" fill="#1A1A1A"/>

  <!-- Soft boots -->
  <rect x="10" y="28" width="5" height="2" fill="#111111"/>
  <rect x="17" y="28" width="5" height="2" fill="#111111"/>

  <!-- Purple mystic particles (teleport essence) -->
  <rect x="2" y="6" width="1" height="1" fill="#8800FF"/>
  <rect x="30" y="10" width="1" height="1" fill="#AA44FF"/>
  <rect x="6" y="26" width="1" height="1" fill="#8800FF"/>
  <rect x="28" y="24" width="1" height="1" fill="#AA44FF"/>
  <rect x="1" y="16" width="1" height="1" fill="#6600CC"/>
  <rect x="31" y="4" width="1" height="1" fill="#6600CC"/>
</svg>