<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Enderman - Top-down view - Minecraft Survivors -->

  <!-- Head (dark purple/black) -->
  <rect x="10" y="2" width="12" height="10" fill="#161616"/>

  <!-- Face edges -->
  <rect x="10" y="2" width="12" height="2" fill="#0D0D0D"/>

  <!-- Glowing purple eyes -->
  <rect x="12" y="6" width="3" height="2" fill="#FF00FF"/>
  <rect x="17" y="6" width="3" height="2" fill="#FF00FF"/>

  <!-- Eye glow effect -->
  <rect x="13" y="7" width="1" height="1" fill="#FF66FF"/>
  <rect x="18" y="7" width="1" height="1" fill="#FF66FF"/>

  <!-- Body (tall, thin, dark) -->
  <rect x="12" y="12" width="8" height="12" fill="#161616"/>
  <rect x="14" y="12" width="4" height="12" fill="#1A1A1A"/>

  <!-- Long arms (extended) -->
  <rect x="4" y="14" width="8" height="3" fill="#161616"/>
  <rect x="20" y="14" width="8" height="3" fill="#161616"/>

  <!-- Hands -->
  <rect x="4" y="15" width="2" height="2" fill="#0D0D0D"/>
  <rect x="26" y="15" width="2" height="2" fill="#0D0D0D"/>

  <!-- Legs (long, thin) -->
  <rect x="12" y="24" width="3" height="6" fill="#161616"/>
  <rect x="17" y="24" width="3" height="6" fill="#161616"/>

  <!-- Purple particle effects around body -->
  <rect x="8" y="10" width="1" height="1" fill="#8800FF" opacity="0.6"/>
  <rect x="23" y="12" width="1" height="1" fill="#8800FF" opacity="0.6"/>
  <rect x="6" y="20" width="1" height="1" fill="#8800FF" opacity="0.6"/>
  <rect x="25" y="22" width="1" height="1" fill="#8800FF" opacity="0.6"/>
</svg>
