<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" width="48" height="32" shape-rendering="crispEdges">
  <!-- Spider - Top-down view - Minecraft Survivors -->

  <!-- Body (dark gray-brown) -->
  <rect x="18" y="8" width="12" height="16" fill="#4A4040"/>
  <rect x="16" y="10" width="16" height="12" fill="#3D3535"/>

  <!-- Head -->
  <rect x="20" y="4" width="8" height="6" fill="#4A4040"/>

  <!-- Red eyes (8 eyes in 2 rows) -->
  <rect x="20" y="5" width="2" height="2" fill="#CC0000"/>
  <rect x="23" y="5" width="2" height="2" fill="#CC0000"/>
  <rect x="26" y="5" width="2" height="2" fill="#CC0000"/>
  <rect x="21" y="8" width="2" height="2" fill="#CC0000"/>
  <rect x="25" y="8" width="2" height="2" fill="#CC0000"/>

  <!-- Legs (8 legs, 4 on each side) -->
  <!-- Left legs -->
  <rect x="4" y="8" width="14" height="2" fill="#4A4040"/>
  <rect x="2" y="6" width="4" height="2" fill="#3D3535"/>

  <rect x="6" y="12" width="12" height="2" fill="#4A4040"/>
  <rect x="2" y="11" width="4" height="2" fill="#3D3535"/>

  <rect x="6" y="16" width="12" height="2" fill="#4A4040"/>
  <rect x="2" y="17" width="4" height="2" fill="#3D3535"/>

  <rect x="4" y="20" width="14" height="2" fill="#4A4040"/>
  <rect x="2" y="22" width="4" height="2" fill="#3D3535"/>

  <!-- Right legs -->
  <rect x="30" y="8" width="14" height="2" fill="#4A4040"/>
  <rect x="42" y="6" width="4" height="2" fill="#3D3535"/>

  <rect x="30" y="12" width="12" height="2" fill="#4A4040"/>
  <rect x="42" y="11" width="4" height="2" fill="#3D3535"/>

  <rect x="30" y="16" width="12" height="2" fill="#4A4040"/>
  <rect x="42" y="17" width="4" height="2" fill="#3D3535"/>

  <rect x="30" y="20" width="14" height="2" fill="#4A4040"/>
  <rect x="42" y="22" width="4" height="2" fill="#3D3535"/>
</svg>