<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Grass with Flowers - Top-down view - Minecraft Survivors -->

  <!-- Base grass -->
  <rect x="0" y="0" width="32" height="32" fill="#7CBD6B"/>

  <!-- Darker grass patches -->
  <rect x="4" y="0" width="4" height="4" fill="#5A9C4A"/>
  <rect x="16" y="4" width="4" height="4" fill="#5A9C4A"/>
  <rect x="0" y="12" width="4" height="4" fill="#5A9C4A"/>
  <rect x="24" y="12" width="4" height="4" fill="#5A9C4A"/>
  <rect x="8" y="20" width="4" height="4" fill="#5A9C4A"/>
  <rect x="28" y="24" width="4" height="4" fill="#5A9C4A"/>
  <rect x="4" y="28" width="4" height="4" fill="#5A9C4A"/>

  <!-- Yellow flower 1 -->
  <rect x="6" y="6" width="2" height="2" fill="#FFE135"/>
  <rect x="4" y="8" width="2" height="2" fill="#FFE135"/>
  <rect x="8" y="8" width="2" height="2" fill="#FFE135"/>
  <rect x="6" y="10" width="2" height="2" fill="#FFE135"/>
  <rect x="6" y="8" width="2" height="2" fill="#FFD700"/>

  <!-- White flower 2 -->
  <rect x="22" y="4" width="2" height="2" fill="#FFFFFF"/>
  <rect x="20" y="6" width="2" height="2" fill="#FFFFFF"/>
  <rect x="24" y="6" width="2" height="2" fill="#FFFFFF"/>
  <rect x="22" y="8" width="2" height="2" fill="#FFFFFF"/>
  <rect x="22" y="6" width="2" height="2" fill="#FFFFAA"/>

  <!-- Red flower 3 -->
  <rect x="14" y="22" width="2" height="2" fill="#FF4444"/>
  <rect x="12" y="24" width="2" height="2" fill="#FF4444"/>
  <rect x="16" y="24" width="2" height="2" fill="#FF4444"/>
  <rect x="14" y="26" width="2" height="2" fill="#FF4444"/>
  <rect x="14" y="24" width="2" height="2" fill="#CC0000"/>
