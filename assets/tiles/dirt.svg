<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Dirt Tile - Top-down view - Minecraft Survivors -->

  <!-- Base dirt -->
  <rect x="0" y="0" width="32" height="32" fill="#8B6B47"/>

  <!-- Darker dirt patches -->
  <rect x="0" y="0" width="4" height="4" fill="#6B4423"/>
  <rect x="12" y="4" width="4" height="4" fill="#6B4423"/>
  <rect x="24" y="0" width="4" height="4" fill="#6B4423"/>
  <rect x="4" y="12" width="4" height="4" fill="#6B4423"/>
  <rect x="20" y="12" width="4" height="4" fill="#6B4423"/>
  <rect x="0" y="20" width="4" height="4" fill="#6B4423"/>
  <rect x="16" y="20" width="4" height="4" fill="#6B4423"/>
  <rect x="28" y="20" width="4" height="4" fill="#6B4423"/>
  <rect x="8" y="28" width="4" height="4" fill="#6B4423"/>
  <rect x="24" y="28" width="4" height="4" fill="#6B4423"/>

  <!-- Lighter patches -->
  <rect x="8" y="8" width="4" height="4" fill="#9C7B57"/>
  <rect x="28" y="8" width="4" height="4" fill="#9C7B57"/>
  <rect x="12" y="24" width="4" height="4" fill="#9C7B57"/>

  <!-- Small pebbles -->
  <rect x="18" y="2" width="2" height="2" fill="#666666"/>
  <rect x="2" y="16" width="2" height="2" fill="#666666"/>
  <rect x="26" y="26" width="2" height="2" fill="#666666"/>
</svg>