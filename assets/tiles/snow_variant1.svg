<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Snow with Ice Crystals - Minecraft Survivors -->

  <!-- Base snow -->
  <rect x="0" y="0" width="32" height="32" fill="#E8EEF0"/>

  <!-- Shadow patches -->
  <rect x="4" y="0" width="4" height="4" fill="#C8D8E0"/>
  <rect x="20" y="4" width="4" height="4" fill="#C8D8E0"/>
  <rect x="0" y="16" width="4" height="4" fill="#C8D8E0"/>
  <rect x="24" y="20" width="4" height="4" fill="#C8D8E0"/>
  <rect x="8" y="24" width="4" height="4" fill="#C8D8E0"/>

  <!-- Ice crystal cluster 1 -->
  <rect x="10" y="8" width="2" height="2" fill="#A0D0F0"/>
  <rect x="12" y="10" width="2" height="2" fill="#A0D0F0"/>
  <rect x="14" y="8" width="2" height="2" fill="#A0D0F0"/>
  <rect x="12" y="6" width="2" height="2" fill="#B0E0FF"/>
  <rect x="12" y="12" width="2" height="2" fill="#B0E0FF"/>

  <!-- Ice crystal cluster 2 -->
  <rect x="22" y="18" width="2" height="2" fill="#A0D0F0"/>
  <rect x="20" y="16" width="2" height="2" fill="#B0E0FF"/>

  <!-- Bright highlights -->
  <rect x="26" y="6" width="2" height="2" fill="#FFFFFF"/>
  <rect x="4" y="28" width="2" height="2" fill="#FFFFFF"/>
</svg>