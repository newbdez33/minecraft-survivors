<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Swamp with Mushrooms - Minecraft Survivors -->

  <!-- Base swamp -->
  <rect x="0" y="0" width="32" height="32" fill="#4A6B3A"/>

  <!-- Deep dark patches -->
  <rect x="0" y="4" width="4" height="4" fill="#3A5A2A"/>
  <rect x="16" y="0" width="4" height="4" fill="#3A5A2A"/>
  <rect x="28" y="12" width="4" height="4" fill="#3A5A2A"/>
  <rect x="4" y="20" width="4" height="4" fill="#3A5A2A"/>
  <rect x="20" y="28" width="4" height="4" fill="#3A5A2A"/>

  <!-- Red mushroom (top-down) -->
  <rect x="8" y="8" width="6" height="6" fill="#CC3333"/>
  <rect x="10" y="10" width="2" height="2" fill="#FFFFFF"/>
  <rect x="8" y="8" width="2" height="2" fill="#FF4444"/>

  <!-- Brown mushroom -->
  <rect x="20" y="16" width="4" height="4" fill="#8B6B47"/>
  <rect x="21" y="17" width="2" height="2" fill="#A08060"/>

  <!-- Small mushroom -->
  <rect x="12" y="24" width="2" height="2" fill="#CC3333"/>
  <rect x="12" y="24" width="1" height="1" fill="#FFFFFF"/>

  <!-- Muddy water specks -->
  <rect x="24" y="4" width="2" height="2" fill="#5A7A4A"/>
  <rect x="2" y="14" width="2" height="2" fill="#5A7A4A"/>
</svg>