<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Desert with Cracks - Minecraft Survivors -->

  <!-- Base sand -->
  <rect x="0" y="0" width="32" height="32" fill="#E8D5A3"/>

  <!-- Darker sand patches -->
  <rect x="0" y="4" width="4" height="4" fill="#C4A96B"/>
  <rect x="16" y="0" width="4" height="4" fill="#C4A96B"/>
  <rect x="28" y="12" width="4" height="4" fill="#C4A96B"/>
  <rect x="4" y="20" width="4" height="4" fill="#C4A96B"/>
  <rect x="20" y="24" width="4" height="4" fill="#C4A96B"/>

  <!-- Crack lines (dried earth) -->
  <rect x="8" y="8" width="2" height="6" fill="#B09060"/>
  <rect x="10" y="12" width="4" height="2" fill="#B09060"/>
  <rect x="14" y="10" width="2" height="4" fill="#B09060"/>
  <rect x="20" y="16" width="6" height="2" fill="#B09060"/>
  <rect x="24" y="18" width="2" height="4" fill="#B09060"/>
  <rect x="6" y="22" width="4" height="2" fill="#B09060"/>

  <!-- Light sand highlights -->
  <rect x="22" y="4" width="2" height="2" fill="#F0E4BE"/>
  <rect x="12" y="26" width="2" height="2" fill="#F0E4BE"/>
</svg>