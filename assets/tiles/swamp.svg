  <rect x="24" y="0" width="4" height="4" fill="#3A5A2A"/>
  <rect x="8" y="12" width="4" height="4" fill="#3A5A2A"/>
  <rect x="20" y="8" width="4" height="4" fill="#3A5A2A"/>
  <rect x="0" y="20" width="4" height="4" fill="#3A5A2A"/>
  <rect x="16" y="20" width="4" height="4" fill="#3A5A2A"/>
  <rect x="28" y="16" width="4" height="4" fill="#3A5A2A"/>
  <rect x="8" y="28" width="4" height="4" fill="#3A5A2A"/>
  <rect x="24" y="24" width="4" height="4" fill="#3A5A2A"/>

  <!-- Muddy water specks -->
  <rect x="6" y="6" width="2" height="2" fill="#5A7A4A"/>
