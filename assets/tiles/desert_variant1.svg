<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Desert with Cactus - Minecraft Survivors -->

  <!-- Base sand -->
  <rect x="0" y="0" width="32" height="32" fill="#E8D5A3"/>

  <!-- Darker sand patches -->
  <rect x="4" y="0" width="4" height="4" fill="#C4A96B"/>
  <rect x="20" y="4" width="4" height="4" fill="#C4A96B"/>
  <rect x="0" y="16" width="4" height="4" fill="#C4A96B"/>
  <rect x="24" y="20" width="4" height="4" fill="#C4A96B"/>
  <rect x="8" y="24" width="4" height="4" fill="#C4A96B"/>

  <!-- Small cactus (top-down view) -->
  <rect x="12" y="10" width="8" height="8" fill="#2D7A2D"/>
  <rect x="14" y="12" width="4" height="4" fill="#3A9A3A"/>
  <rect x="10" y="14" width="2" height="4" fill="#2D7A2D"/>
  <rect x="20" y="12" width="2" height="4" fill="#2D7A2D"/>

  <!-- Light sand highlights -->
  <rect x="26" y="6" width="2" height="2" fill="#F0E4BE"/>
  <rect x="4" y="26" width="2" height="2" fill="#F0E4BE"/>
</svg>