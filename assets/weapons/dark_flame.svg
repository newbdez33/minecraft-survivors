<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Dark Flame (暗火) - Dark purple-black flame projectile - Replaces wither_skull -->

  <!-- Outer dark aura -->
  <rect x="5" y="1" width="2" height="1" fill="#1A0033"/>
  <rect x="9" y="2" width="1" height="1" fill="#1A0033"/>
  <rect x="3" y="4" width="1" height="3" fill="#1A0033"/>
  <rect x="12" y="5" width="1" height="2" fill="#1A0033"/>

  <!-- Main flame body (dark purple) -->
  <rect x="5" y="2" width="4" height="2" fill="#4B0082"/>
  <rect x="4" y="4" width="8" height="4" fill="#4B0082"/>
  <rect x="5" y="8" width="6" height="2" fill="#4B0082"/>
  <rect x="6" y="10" width="4" height="2" fill="#4B0082"/>

  <!-- Inner flame (magenta edges) -->
  <rect x="5" y="3" width="2" height="2" fill="#8B008B"/>
  <rect x="8" y="4" width="2" height="3" fill="#8B008B"/>
  <rect x="5" y="6" width="3" height="2" fill="#8B008B"/>
  <rect x="7" y="8" width="2" height="2" fill="#8B008B"/>

  <!-- Hot core -->
  <rect x="6" y="5" width="2" height="3" fill="#AA00AA"/>
  <rect x="7" y="4" width="1" height="1" fill="#CC33CC"/>

  <!-- Flame tips (flickering upward) -->
  <rect x="6" y="1" width="1" height="1" fill="#4B0082"/>
  <rect x="8" y="0" width="1" height="2" fill="#8B008B"/>
  <rect x="10" y="3" width="1" height="2" fill="#4B0082"/>

  <!-- Trailing wisps -->
  <rect x="6" y="12" width="1" height="1" fill="#330055"/>
  <rect x="8" y="13" width="1" height="1" fill="#220044"/>
  <rect x="7" y="12" width="1" height="2" fill="#4B0082"/>
</svg>
