<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Divine Weapon (神兵) - Legendary golden dao - Replaces diamond_sword -->

  <!-- Blade glow (outer aura) -->
  <rect x="14" y="0" width="1" height="1" fill="#FFEC8B" fill-opacity="0.5"/>
  <rect x="12" y="2" width="1" height="1" fill="#FFEC8B" fill-opacity="0.5"/>

  <!-- Blade (golden) -->
  <rect x="13" y="0" width="2" height="2" fill="#FFD700"/>
  <rect x="12" y="1" width="2" height="2" fill="#FFEC8B"/>
  <rect x="11" y="2" width="2" height="2" fill="#FFD700"/>
  <rect x="10" y="3" width="3" height="2" fill="#DAA520"/>
  <rect x="11" y="3" width="1" height="1" fill="#FFEC8B"/>
  <rect x="9" y="4" width="2" height="2" fill="#FFD700"/>
  <rect x="8" y="5" width="3" height="2" fill="#DAA520"/>
  <rect x="9" y="5" width="1" height="1" fill="#FFEC8B"/>
  <rect x="7" y="6" width="2" height="2" fill="#FFD700"/>
  <rect x="6" y="7" width="2" height="2" fill="#DAA520"/>

  <!-- Jade guard -->
  <rect x="4" y="9" width="2" height="2" fill="#00AA88"/>
  <rect x="6" y="9" width="2" height="2" fill="#00CC99"/>
  <rect x="5" y="9" width="2" height="1" fill="#00DDAA"/>

  <!-- Red tassel (hanging from guard) -->
  <rect x="3" y="10" width="1" height="2" fill="#CC2222"/>
  <rect x="3" y="12" width="1" height="1" fill="#FF4444"/>

  <!-- Handle (dark red/lacquered) -->
  <rect x="3" y="11" width="2" height="2" fill="#8B2222"/>
  <rect x="2" y="12" width="2" height="2" fill="#6B1111"/>

  <!-- Golden pommel -->
  <rect x="1" y="13" width="2" height="2" fill="#FFD700"/>
</svg>
