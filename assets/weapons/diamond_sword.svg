<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Diamond Sword - Minecraft Survivors -->

  <!-- Blade (diagonal, pointing top-right) -->
  <rect x="12" y="1" width="2" height="2" fill="#33EBCB"/>
  <rect x="10" y="3" width="2" height="2" fill="#33EBCB"/>
  <rect x="11" y="2" width="2" height="2" fill="#5FFBEB"/>
  <rect x="8" y="5" width="2" height="2" fill="#33EBCB"/>
  <rect x="9" y="4" width="2" height="2" fill="#5FFBEB"/>
  <rect x="6" y="7" width="2" height="2" fill="#33EBCB"/>
  <rect x="7" y="6" width="2" height="2" fill="#5FFBEB"/>

  <!-- Guard (gray) -->
  <rect x="4" y="9" width="2" height="2" fill="#888888"/>
  <rect x="6" y="9" width="2" height="2" fill="#666666"/>

  <!-- Handle (brown) -->
  <rect x="3" y="11" width="2" height="2" fill="#8B5A2B"/>
  <rect x="2" y="12" width="2" height="2" fill="#6B4423"/>

  <!-- Pommel -->
  <rect x="1" y="13" width="2" height="2" fill="#8B5A2B"/>
</svg>