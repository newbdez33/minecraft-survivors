<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Steel Blade (钢刃) - Improved dao - Replaces stone_sword -->

  <!-- Blade tip (longer, brighter steel) -->
  <rect x="13" y="0" width="2" height="2" fill="#B0B0B0"/>
  <rect x="12" y="1" width="2" height="2" fill="#CCCCCC"/>
  <rect x="11" y="2" width="2" height="2" fill="#B0B0B0"/>
  <rect x="10" y="3" width="3" height="2" fill="#CCCCCC"/>
  <rect x="9" y="4" width="2" height="2" fill="#B0B0B0"/>
  <rect x="8" y="5" width="3" height="2" fill="#CCCCCC"/>
  <rect x="7" y="6" width="2" height="2" fill="#B0B0B0"/>
  <rect x="6" y="7" width="2" height="2" fill="#CCCCCC"/>

  <!-- Guard (iron with wrapped detail) -->
  <rect x="4" y="9" width="2" height="2" fill="#888888"/>
  <rect x="6" y="9" width="2" height="2" fill="#777777"/>
  <rect x="5" y="9" width="1" height="1" fill="#999999"/>

  <!-- Handle (wrapped leather/wood) -->
  <rect x="3" y="11" width="2" height="2" fill="#8B5A2B"/>
  <rect x="3" y="11" width="1" height="1" fill="#6B4423"/>
  <rect x="4" y="12" width="1" height="1" fill="#6B4423"/>
  <rect x="2" y="12" width="2" height="2" fill="#6B4423"/>

  <!-- Pommel -->
  <rect x="1" y="13" width="2" height="2" fill="#888888"/>
</svg>
