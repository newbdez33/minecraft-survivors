<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 8" width="16" height="8" shape-rendering="crispEdges">
  <!-- Arrow - Minecraft Survivors -->

  <!-- Arrowhead (gray/iron) -->
  <rect x="14" y="3" width="2" height="2" fill="#888888"/>
  <rect x="12" y="2" width="2" height="4" fill="#AAAAAA"/>

  <!-- Shaft (brown) -->
  <rect x="4" y="3" width="8" height="2" fill="#8B5A2B"/>

  <!-- Fletching (red feathers) -->
  <rect x="0" y="2" width="2" height="1" fill="#CC0000"/>
  <rect x="2" y="3" width="2" height="2" fill="#8B5A2B"/>
  <rect x="0" y="5" width="2" height="1" fill="#CC0000"/>
  <rect x="1" y="3" width="1" height="2" fill="#FF4444"/>
</svg>