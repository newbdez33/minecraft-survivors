<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Repeating Crossbow (连弩/诸葛弩) - Chinese zhuge nu - Replaces crossbow -->

  <!-- Magazine/box on top (holds bolts) -->
  <rect x="4" y="3" width="6" height="3" fill="#8B5A2B"/>
  <rect x="5" y="4" width="4" height="1" fill="#6B4423"/>

  <!-- Crossbow stock (horizontal body) -->
  <rect x="1" y="6" width="2" height="3" fill="#6B4423"/>
  <rect x="3" y="6" width="6" height="3" fill="#8B5A2B"/>
  <rect x="9" y="6" width="2" height="3" fill="#6B4423"/>

  <!-- Bow limbs (curved) -->
  <rect x="0" y="5" width="2" height="2" fill="#5D3A1A"/>
  <rect x="0" y="9" width="2" height="2" fill="#5D3A1A"/>

  <!-- String -->
  <rect x="2" y="5" width="1" height="1" fill="#CCCCCC"/>
  <rect x="2" y="10" width="1" height="1" fill="#CCCCCC"/>

  <!-- Metal mechanism/trigger -->
  <rect x="5" y="9" width="2" height="2" fill="#888888"/>
  <rect x="6" y="10" width="1" height="2" fill="#777777"/>

  <!-- Loaded bolt (peeking out) -->
  <rect x="10" y="7" width="4" height="1" fill="#666666"/>
  <rect x="14" y="7" width="1" height="1" fill="#888888"/>

  <!-- Additional bolts visible in magazine -->
  <rect x="5" y="3" width="1" height="1" fill="#555555"/>
  <rect x="7" y="3" width="1" height="1" fill="#555555"/>
  <rect x="9" y="3" width="1" height="1" fill="#555555"/>

  <!-- Metal reinforcement -->
  <rect x="3" y="6" width="1" height="3" fill="#888888"/>
</svg>
