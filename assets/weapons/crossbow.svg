<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Crossbow - Minecraft Style Pixel Art -->

  <!-- Crossbow stock (horizontal) -->
  <rect x="1" y="7" width="2" height="2" fill="#6B4423"/>
  <rect x="3" y="7" width="4" height="2" fill="#8B5A2B"/>
  <rect x="7" y="7" width="2" height="2" fill="#6B4423"/>

  <!-- Crossbow limbs (top and bottom) -->
  <rect x="6" y="3" width="2" height="2" fill="#5D3A1A"/>
  <rect x="4" y="4" width="2" height="2" fill="#5D3A1A"/>
  <rect x="3" y="5" width="2" height="2" fill="#8B5A2B"/>

  <rect x="6" y="11" width="2" height="2" fill="#5D3A1A"/>
  <rect x="4" y="10" width="2" height="2" fill="#5D3A1A"/>
  <rect x="3" y="9" width="2" height="2" fill="#8B5A2B"/>

  <!-- String -->
  <rect x="7" y="4" width="1" height="3" fill="#CCCCCC"/>
  <rect x="7" y="9" width="1" height="3" fill="#CCCCCC"/>

  <!-- Bolt/Arrow -->
  <rect x="8" y="7" width="6" height="2" fill="#666666"/>
  <rect x="14" y="7" width="1" height="2" fill="#888888"/>

  <!-- Bolt tip -->
  <rect x="15" y="7" width="1" height="2" fill="#AAAAAA"/>

  <!-- Mechanism -->
  <rect x="5" y="6" width="2" height="4" fill="#654321"/>
</svg>
