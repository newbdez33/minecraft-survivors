<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Potion - Top-down view - Minecraft Survivors -->

  <!-- Bottle neck/cork (brown) -->
  <rect x="13" y="4" width="6" height="3" fill="#8B4513"/>
  <rect x="14" y="3" width="4" height="1" fill="#654321"/>

  <!-- Bottle top (glass) -->
  <rect x="12" y="7" width="8" height="3" fill="#B8D4E8"/>
  <rect x="13" y="7" width="2" height="3" fill="#D4E8F4" opacity="0.6"/>

  <!-- Bottle body (glass with liquid) -->
  <rect x="8" y="10" width="16" height="14" fill="#B8D4E8"/>

  <!-- Liquid (poison green/purple) -->
  <rect x="9" y="12" width="14" height="11" fill="#8B008B"/>
  <rect x="10" y="13" width="12" height="9" fill="#9932CC"/>

  <!-- Bubbles in liquid -->
  <rect x="12" y="15" width="2" height="2" fill="#BA55D3"/>
  <rect x="17" y="18" width="2" height="2" fill="#BA55D3"/>
  <rect x="14" y="20" width="1" height="1" fill="#DA70D6"/>

  <!-- Glass shine -->
  <rect x="9" y="10" width="2" height="8" fill="#D4E8F4" opacity="0.5"/>

  <!-- Bottle bottom -->
  <rect x="10" y="24" width="12" height="2" fill="#A0C4D8"/>

  <!-- Splash effect particles -->
  <rect x="5" y="14" width="2" height="2" fill="#9932CC" opacity="0.5"/>
  <rect x="25" y="16" width="2" height="2" fill="#9932CC" opacity="0.5"/>
  <rect x="6" y="22" width="1" height="1" fill="#BA55D3" opacity="0.4"/>
  <rect x="26" y="20" width="1" height="1" fill="#BA55D3" opacity="0.4"/>
</svg>
