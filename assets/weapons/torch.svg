<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Torch - Minecraft style (thin stick with small flame) -->

  <!-- Flame (small, 2-3 pixels) -->
  <rect x="7" y="2" width="2" height="1" fill="#FFFF00"/>
  <rect x="7" y="3" width="2" height="1" fill="#FFAA00"/>
  <rect x="7" y="4" width="2" height="1" fill="#FF6600"/>

  <!-- Torch stick (thin, 2 pixels wide) -->
  <rect x="7" y="5" width="2" height="9" fill="#8B4513"/>

  <!-- Wood shading -->
  <rect x="7" y="5" width="1" height="9" fill="#654321"/>
  <rect x="8" y="5" width="1" height="9" fill="#A0522D"/>

  <!-- Top cap -->
  <rect x="7" y="5" width="2" height="1" fill="#5C3317"/>
</svg>
