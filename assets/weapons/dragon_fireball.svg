<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Dragon Fireball - Purple/magenta energy ball -->
  <!-- Core -->
  <rect x="5" y="5" width="6" height="6" fill="#9400D3"/>
  <rect x="6" y="6" width="4" height="4" fill="#DA70D6"/>
  <rect x="7" y="7" width="2" height="2" fill="#FF00FF"/>
  <!-- Outer glow -->
  <rect x="4" y="6" width="1" height="4" fill="#6B006B"/>
  <rect x="11" y="6" width="1" height="4" fill="#6B006B"/>
  <rect x="6" y="4" width="4" height="1" fill="#6B006B"/>
  <rect x="6" y="11" width="4" height="1" fill="#6B006B"/>
  <!-- Fire trail -->
  <rect x="2" y="7" width="2" height="2" fill="#FF6600"/>
  <rect x="0" y="7" width="2" height="2" fill="#FF3300"/>
  <rect x="3" y="6" width="1" height="1" fill="#FFAA00"/>
  <rect x="3" y="9" width="1" height="1" fill="#FFAA00"/>
</svg>
