<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 24" width="16" height="24" shape-rendering="crispEdges">
  <!-- Evoker Fang - Ground attack effect - Minecraft Survivors -->
  <!-- Purple magical fang that erupts from ground -->

  <!-- Ground crack/emergence point -->
  <rect x="4" y="20" width="8" height="4" fill="#3A3A3A"/>
  <rect x="6" y="21" width="4" height="2" fill="#2A2A2A"/>

  <!-- Fang base (darker purple) -->
  <rect x="5" y="16" width="6" height="4" fill="#4B0082"/>
  <rect x="6" y="18" width="4" height="2" fill="#3A006B"/>

  <!-- Fang middle -->
  <rect x="5" y="10" width="6" height="6" fill="#8B00FF"/>
  <rect x="6" y="12" width="4" height="4" fill="#9932CC"/>

  <!-- Fang tip (sharp point) -->
  <rect x="6" y="6" width="4" height="4" fill="#9932CC"/>
  <rect x="7" y="4" width="2" height="2" fill="#BA55D3"/>
  <rect x="7" y="2" width="2" height="2" fill="#DA70D6"/>
  <rect x="7" y="0" width="2" height="2" fill="#EE82EE"/>

  <!-- Magic glow effect (lighter edges) -->
  <rect x="4" y="12" width="1" height="4" fill="#DA70D6" fill-opacity="0.7"/>
  <rect x="11" y="12" width="1" height="4" fill="#DA70D6" fill-opacity="0.7"/>
  <rect x="4" y="8" width="1" height="2" fill="#EE82EE" fill-opacity="0.5"/>
  <rect x="11" y="8" width="1" height="2" fill="#EE82EE" fill-opacity="0.5"/>

  <!-- Sparkle particles -->
  <rect x="2" y="14" width="1" height="1" fill="#FFFFFF" fill-opacity="0.8"/>
  <rect x="13" y="10" width="1" height="1" fill="#FFFFFF" fill-opacity="0.8"/>
  <rect x="1" y="8" width="1" height="1" fill="#EE82EE" fill-opacity="0.6"/>
  <rect x="14" y="16" width="1" height="1" fill="#EE82EE" fill-opacity="0.6"/>
</svg>
