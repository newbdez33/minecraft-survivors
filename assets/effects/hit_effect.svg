<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 32" width="128" height="32" shape-rendering="crispEdges">
  <!-- Hit Effect Spritesheet - 4 frames - Minecraft Survivors -->

  <!-- Frame 1: Small spark -->
  <rect x="14" y="14" width="4" height="4" fill="#FFFFFF"/>

  <!-- Frame 2: Growing -->
  <rect x="44" y="12" width="8" height="8" fill="#FFFFFF"/>
  <rect x="42" y="14" width="2" height="4" fill="#FFFF00"/>
  <rect x="52" y="14" width="2" height="4" fill="#FFFF00"/>
  <rect x="46" y="10" width="4" height="2" fill="#FFFF00"/>
  <rect x="46" y="20" width="4" height="2" fill="#FFFF00"/>

  <!-- Frame 3: Full burst -->
  <rect x="76" y="12" width="8" height="8" fill="#FFFFFF"/>
  <rect x="72" y="14" width="4" height="4" fill="#FFFF00"/>
  <rect x="84" y="14" width="4" height="4" fill="#FFFF00"/>
  <rect x="78" y="8" width="4" height="4" fill="#FFFF00"/>
  <rect x="78" y="20" width="4" height="4" fill="#FFFF00"/>
  <rect x="70" y="10" width="2" height="2" fill="#FF8800"/>
  <rect x="88" y="10" width="2" height="2" fill="#FF8800"/>
  <rect x="70" y="20" width="2" height="2" fill="#FF8800"/>
  <rect x="88" y="20" width="2" height="2" fill="#FF8800"/>

  <!-- Frame 4: Fading -->
  <rect x="106" y="12" width="4" height="4" fill="#FFFF88"/>
  <rect x="102" y="14" width="2" height="2" fill="#FFFF00"/>
  <rect x="112" y="14" width="2" height="2" fill="#FFFF00"/>
  <rect x="106" y="8" width="2" height="2" fill="#FFFF00"/>
  <rect x="106" y="20" width="2" height="2" fill="#FFFF00"/>
</svg>