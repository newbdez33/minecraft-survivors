<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 32" width="160" height="32" shape-rendering="crispEdges">
  <!-- Death Poof Spritesheet - 5 frames - Minecraft Survivors -->

  <!-- Frame 1: Initial small puff -->
  <rect x="12" y="12" width="8" height="8" fill="#AAAAAA"/>
  <rect x="14" y="14" width="4" height="4" fill="#CCCCCC"/>

  <!-- Frame 2: Expanding -->
  <rect x="40" y="10" width="12" height="12" fill="#999999"/>
  <rect x="42" y="8" width="8" height="4" fill="#AAAAAA"/>
  <rect x="42" y="20" width="8" height="4" fill="#AAAAAA"/>
  <rect x="44" y="12" width="4" height="8" fill="#CCCCCC"/>

  <!-- Frame 3: Full cloud -->
  <rect x="68" y="6" width="16" height="20" fill="#888888"/>
  <rect x="66" y="10" width="4" height="12" fill="#999999"/>
  <rect x="82" y="10" width="4" height="12" fill="#999999"/>
  <rect x="72" y="4" width="8" height="4" fill="#AAAAAA"/>
  <rect x="72" y="24" width="8" height="4" fill="#AAAAAA"/>
  <rect x="72" y="12" width="8" height="8" fill="#BBBBBB"/>

  <!-- Frame 4: Dissipating -->
  <rect x="100" y="8" width="12" height="16" fill="#999999"/>
  <rect x="98" y="12" width="4" height="8" fill="#AAAAAA"/>
  <rect x="110" y="12" width="4" height="8" fill="#AAAAAA"/>
  <rect x="104" y="6" width="4" height="4" fill="#BBBBBB"/>
  <rect x="104" y="22" width="4" height="4" fill="#BBBBBB"/>

  <!-- Frame 5: Almost gone -->
  <rect x="134" y="10" width="4" height="4" fill="#AAAAAA"/>
  <rect x="140" y="14" width="4" height="4" fill="#BBBBBB"/>
  <rect x="130" y="18" width="4" height="4" fill="#CCCCCC"/>
  <rect x="142" y="20" width="2" height="2" fill="#CCCCCC"/>
</svg>