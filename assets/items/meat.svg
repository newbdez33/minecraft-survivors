<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Steak/Meat - Minecraft Survivors (same size as golden apple) -->

  <!-- Main meat body -->
  <rect x="4" y="2" width="8" height="12" fill="#C4554A"/>
  <rect x="2" y="4" width="2" height="8" fill="#C4554A"/>
  <rect x="12" y="4" width="2" height="8" fill="#C4554A"/>
  <rect x="6" y="14" width="4" height="2" fill="#C4554A"/>

  <!-- Dark edge (cooked) -->
  <rect x="2" y="4" width="2" height="8" fill="#891E18"/>
  <rect x="4" y="12" width="2" height="2" fill="#891E18"/>
  <rect x="6" y="14" width="2" height="2" fill="#891E18"/>

  <!-- Light center (pink meat) -->
  <rect x="5" y="4" width="6" height="8" fill="#E8A090"/>
  <rect x="6" y="5" width="4" height="6" fill="#F0B8A8"/>

  <!-- Highlight -->
  <rect x="7" y="6" width="2" height="3" fill="#F8D0C0"/>
</svg>
