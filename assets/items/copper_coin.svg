<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Copper Coin (铜钱) - Ancient Chinese coin with square hole - Replaces emerald -->

  <!-- Outer rim (copper) -->
  <rect x="4" y="1" width="8" height="2" fill="#B87333"/>
  <rect x="2" y="3" width="2" height="2" fill="#B87333"/>
  <rect x="12" y="3" width="2" height="2" fill="#B87333"/>
  <rect x="1" y="5" width="2" height="6" fill="#B87333"/>
  <rect x="13" y="5" width="2" height="6" fill="#B87333"/>
  <rect x="2" y="11" width="2" height="2" fill="#B87333"/>
  <rect x="12" y="11" width="2" height="2" fill="#B87333"/>
  <rect x="4" y="13" width="8" height="2" fill="#B87333"/>

  <!-- Main coin body -->
  <rect x="3" y="3" width="10" height="10" fill="#CD853F"/>
  <rect x="4" y="2" width="8" height="1" fill="#CD853F"/>
  <rect x="4" y="13" width="8" height="1" fill="#CD853F"/>

  <!-- Square hole in center (dark) -->
  <rect x="6" y="6" width="4" height="4" fill="#4A3728"/>
  <rect x="7" y="7" width="2" height="2" fill="#2A1F14"/>

  <!-- Raised rim around square hole -->
  <rect x="5" y="5" width="6" height="1" fill="#DEB068"/>
  <rect x="5" y="10" width="6" height="1" fill="#B87333"/>
  <rect x="5" y="6" width="1" height="4" fill="#DEB068"/>
  <rect x="10" y="6" width="1" height="4" fill="#B87333"/>

  <!-- Highlight (top-left) -->
  <rect x="4" y="3" width="2" height="2" fill="#DEB068"/>
  <rect x="6" y="2" width="2" height="1" fill="#E8C888"/>

  <!-- Patina/aging detail -->
  <rect x="10" y="11" width="2" height="2" fill="#8B6914"/>
</svg>
