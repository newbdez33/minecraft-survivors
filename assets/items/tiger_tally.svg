<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Tiger Tally (虎符) - Tiger-shaped military token - Replaces totem -->

  <!-- Tiger body (bronze, facing right) -->
  <rect x="2" y="6" width="12" height="4" fill="#CD853F"/>
  <rect x="3" y="5" width="10" height="1" fill="#CD853F"/>
  <rect x="4" y="4" width="8" height="1" fill="#CD853F"/>

  <!-- Tiger head (right side, blocky) -->
  <rect x="12" y="4" width="3" height="4" fill="#CD853F"/>
  <rect x="13" y="3" width="2" height="2" fill="#B8763C"/>

  <!-- Ears -->
  <rect x="13" y="2" width="1" height="1" fill="#CD853F"/>
  <rect x="14" y="2" width="1" height="1" fill="#B8763C"/>

  <!-- Eye -->
  <rect x="13" y="4" width="1" height="1" fill="#2A1F14"/>

  <!-- Mouth/jaw -->
  <rect x="14" y="6" width="1" height="1" fill="#8B6914"/>

  <!-- Tiger stripes (dark) -->
  <rect x="5" y="5" width="1" height="4" fill="#8B6914"/>
  <rect x="7" y="5" width="1" height="4" fill="#8B6914"/>
  <rect x="9" y="5" width="1" height="4" fill="#8B6914"/>
  <rect x="11" y="5" width="1" height="3" fill="#8B6914"/>

  <!-- Legs (short, sturdy) -->
  <rect x="4" y="10" width="2" height="2" fill="#CD853F"/>
  <rect x="9" y="10" width="2" height="2" fill="#CD853F"/>
  <rect x="4" y="11" width="1" height="1" fill="#8B6914"/>
  <rect x="10" y="11" width="1" height="1" fill="#8B6914"/>

  <!-- Tail (left side, curled up) -->
  <rect x="1" y="5" width="2" height="1" fill="#CD853F"/>
  <rect x="0" y="4" width="2" height="1" fill="#B8763C"/>

  <!-- Split line down middle (the tally splits in two halves) -->
  <rect x="2" y="8" width="12" height="1" fill="#6B4423"/>

  <!-- Bronze highlight -->
  <rect x="3" y="5" width="2" height="1" fill="#DEB068"/>
  <rect x="6" y="6" width="2" height="1" fill="#DEB068"/>

  <!-- Belly detail -->
  <rect x="3" y="10" width="9" height="1" fill="#B8763C"/>
</svg>
