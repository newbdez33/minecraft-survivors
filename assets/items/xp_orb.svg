<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- XP Orb - Minecraft Survivors -->

  <!-- Outer glow -->
  <rect x="4" y="2" width="8" height="2" fill="#5EFF00"/>
  <rect x="2" y="4" width="2" height="8" fill="#5EFF00"/>
  <rect x="12" y="4" width="2" height="8" fill="#5EFF00"/>
  <rect x="4" y="12" width="8" height="2" fill="#5EFF00"/>

  <!-- Main orb body -->
  <rect x="4" y="4" width="8" height="8" fill="#7FFF00"/>

  <!-- Inner bright center -->
  <rect x="6" y="6" width="4" height="4" fill="#AEFF00"/>

  <!-- Highlight -->
  <rect x="5" y="5" width="2" height="2" fill="#CCFF00"/>
  <rect x="6" y="4" width="2" height="1" fill="#EEFF88"/>
</svg>