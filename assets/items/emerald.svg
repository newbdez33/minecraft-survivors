<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Emerald - Boss drop currency - Minecraft Survivors -->

  <!-- Main emerald shape (hexagonal gem) -->
  <rect x="6" y="1" width="4" height="2" fill="#00FF00"/>
  <rect x="4" y="3" width="8" height="2" fill="#00DD00"/>
  <rect x="3" y="5" width="10" height="4" fill="#00CC00"/>
  <rect x="4" y="9" width="8" height="2" fill="#00AA00"/>
  <rect x="5" y="11" width="6" height="2" fill="#009900"/>
  <rect x="6" y="13" width="4" height="2" fill="#008800"/>

  <!-- Shine/highlight -->
  <rect x="5" y="4" width="2" height="2" fill="#88FF88"/>
  <rect x="4" y="6" width="2" height="1" fill="#66FF66"/>
  <rect x="7" y="2" width="1" height="1" fill="#AAFFAA"/>

  <!-- Dark facets -->
  <rect x="9" y="5" width="2" height="3" fill="#007700"/>
  <rect x="8" y="9" width="2" height="2" fill="#006600"/>
  <rect x="10" y="7" width="1" height="2" fill="#005500"/>
