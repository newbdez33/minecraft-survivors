<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 24" width="16" height="24" shape-rendering="crispEdges">
  <!-- Totem of Undying - Rare boss drop - Minecraft Survivors -->

  <!-- Main body (gold) -->
  <rect x="5" y="6" width="6" height="14" fill="#DAA520"/>
  <rect x="6" y="7" width="4" height="12" fill="#FFD700"/>

  <!-- Head/face area -->
  <rect x="5" y="2" width="6" height="6" fill="#DAA520"/>
  <rect x="6" y="3" width="4" height="4" fill="#FFD700"/>

  <!-- Eyes (emerald green) -->
  <rect x="6" y="4" width="2" height="2" fill="#00FF00"/>
  <rect x="9" y="4" width="2" height="2" fill="#00FF00"/>
  <rect x="6" y="4" width="1" height="1" fill="#88FF88"/>
  <rect x="9" y="4" width="1" height="1" fill="#88FF88"/>

  <!-- Top ornament -->
  <rect x="7" y="0" width="2" height="2" fill="#FFD700"/>
  <rect x="7" y="0" width="1" height="1" fill="#FFEC8B"/>

  <!-- Arms (spread wide) -->
  <rect x="1" y="8" width="4" height="4" fill="#DAA520"/>
  <rect x="11" y="8" width="4" height="4" fill="#DAA520"/>
  <rect x="2" y="9" width="2" height="2" fill="#FFD700"/>
  <rect x="12" y="9" width="2" height="2" fill="#FFD700"/>

  <!-- Wings/feathers on arms -->
  <rect x="0" y="7" width="2" height="2" fill="#FFEC8B"/>
  <rect x="14" y="7" width="2" height="2" fill="#FFEC8B"/>

  <!-- Nose/mouth -->
  <rect x="7" y="6" width="2" height="1" fill="#B8860B"/>

  <!-- Belly detail -->
  <rect x="7" y="12" width="2" height="3" fill="#B8860B"/>
  <rect x="7" y="16" width="2" height="2" fill="#8B7355"/>

  <!-- Legs/base -->
  <rect x="5" y="20" width="2" height="4" fill="#B8860B"/>
  <rect x="9" y="20" width="2" height="4" fill="#B8860B"/>

  <!-- Glow effect -->
  <rect x="4" y="10" width="1" height="4" fill="#FFEC8B" fill-opacity="0.5"/>
  <rect x="11" y="10" width="1" height="4" fill="#FFEC8B" fill-opacity="0.5"/>
</svg>
