<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Half Heart - Minecraft Survivors -->

  <!-- Left half (red) -->
  <rect x="1" y="3" width="4" height="4" fill="#FF0000"/>
  <rect x="3" y="1" width="4" height="2" fill="#FF0000"/>
  <rect x="1" y="5" width="7" height="4" fill="#FF0000"/>
  <rect x="2" y="9" width="6" height="2" fill="#FF0000"/>
  <rect x="4" y="11" width="4" height="2" fill="#FF0000"/>
  <rect x="6" y="13" width="2" height="2" fill="#FF0000"/>

  <!-- Left highlight -->
  <rect x="3" y="2" width="2" height="2" fill="#FF6666"/>
  <rect x="2" y="4" width="2" height="2" fill="#FF6666"/>

  <!-- Right half (gray/empty) -->
  <rect x="11" y="3" width="4" height="4" fill="#555555"/>
  <rect x="9" y="1" width="4" height="2" fill="#555555"/>
  <rect x="8" y="5" width="7" height="4" fill="#555555"/>
  <rect x="8" y="9" width="6" height="2" fill="#555555"/>
  <rect x="8" y="11" width="4" height="2" fill="#555555"/>
  <rect x="8" y="13" width="2" height="2" fill="#555555"/>

  <!-- Right dark outline -->
  <rect x="14" y="5" width="1" height="4" fill="#333333"/>
  <rect x="13" y="9" width="1" height="2" fill="#333333"/>
  <rect x="11" y="11" width="1" height="2" fill="#333333"/>
</svg>