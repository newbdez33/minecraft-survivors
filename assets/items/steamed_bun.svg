<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Steamed Bun (馒头) - White steamed bun - Replaces meat -->

  <!-- Steam wisps (above bun) -->
  <rect x="5" y="0" width="1" height="1" fill="#FFFFFF" fill-opacity="0.3"/>
  <rect x="8" y="1" width="1" height="1" fill="#FFFFFF" fill-opacity="0.3"/>
  <rect x="10" y="0" width="1" height="1" fill="#FFFFFF" fill-opacity="0.3"/>

  <!-- Top dome of bun -->
  <rect x="5" y="2" width="6" height="2" fill="#FFFACD"/>
  <rect x="4" y="4" width="8" height="2" fill="#F5F5DC"/>

  <!-- Main body (puffy rounded shape) -->
  <rect x="3" y="6" width="10" height="4" fill="#F5F5DC"/>
  <rect x="2" y="7" width="12" height="2" fill="#F5F5DC"/>

  <!-- Bottom (slightly flat base) -->
  <rect x="4" y="10" width="8" height="2" fill="#E8DCC8"/>
  <rect x="5" y="12" width="6" height="1" fill="#DDD0B8"/>

  <!-- Highlight (top shine) -->
  <rect x="6" y="3" width="3" height="2" fill="#FFFFFF"/>
  <rect x="5" y="5" width="2" height="1" fill="#FFFEF0"/>

  <!-- Subtle fold/crease lines -->
  <rect x="6" y="7" width="1" height="3" fill="#E8DCC8"/>
  <rect x="9" y="7" width="1" height="3" fill="#E8DCC8"/>

  <!-- Shadow at base -->
  <rect x="3" y="10" width="1" height="2" fill="#D4C8B0"/>
  <rect x="12" y="10" width="1" height="2" fill="#D4C8B0"/>
</svg>
