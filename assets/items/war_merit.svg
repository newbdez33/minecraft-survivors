<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- War Merit (战功) - Golden military medal/seal - Replaces xp_orb -->

  <!-- Red ribbon (top) -->
  <rect x="3" y="1" width="4" height="2" fill="#CC2222"/>
  <rect x="9" y="1" width="4" height="2" fill="#CC2222"/>
  <rect x="6" y="2" width="4" height="1" fill="#CC2222"/>

  <!-- Medal body (gold circle) -->
  <rect x="4" y="3" width="8" height="2" fill="#FFD700"/>
  <rect x="3" y="5" width="10" height="6" fill="#FFD700"/>
  <rect x="4" y="11" width="8" height="2" fill="#FFD700"/>
  <rect x="5" y="13" width="6" height="1" fill="#FFD700"/>

  <!-- Dark border/edge -->
  <rect x="3" y="5" width="1" height="6" fill="#DAA520"/>
  <rect x="12" y="5" width="1" height="6" fill="#DAA520"/>
  <rect x="4" y="11" width="1" height="2" fill="#DAA520"/>
  <rect x="11" y="11" width="1" height="2" fill="#DAA520"/>

  <!-- Inner detail (star/seal pattern) -->
  <rect x="7" y="5" width="2" height="1" fill="#FFEC8B"/>
  <rect x="6" y="6" width="4" height="1" fill="#FFEC8B"/>
  <rect x="5" y="7" width="6" height="2" fill="#FFEC8B"/>
  <rect x="6" y="9" width="4" height="1" fill="#FFEC8B"/>
  <rect x="7" y="10" width="2" height="1" fill="#FFEC8B"/>

  <!-- Bright center highlight -->
  <rect x="7" y="7" width="2" height="2" fill="#FFFFFF"/>
</svg>
